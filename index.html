<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashley havens</title>
<link rel="preload" as="image" href="assets/skybg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #fff;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    cursor: crosshair;
  }

  /* ════════════════════════════════════════
     LOADER
  ════════════════════════════════════════ */
  #loader {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: transform 0.55s cubic-bezier(0.76, 0, 0.24, 1),
                opacity   0.3s ease 0.18s;
  }
  #loader.leave {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }

  /* Retro spinner below the letters */
  .retro-spinner {
    width: 48px;
    height: 48px;
    animation: spin 0.7s steps(8, end) infinite;
    opacity: 0.7;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Letter row */
  .loader-letters {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .loader-letters img {
    height: 52px;
    width: auto;
    animation: letterPulse 0.75s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes letterPulse {
    0%,100% { transform: scale(1);    opacity: 1; }
    50%     { transform: scale(1.25); opacity: 0.75; }
  }
  /* exit: letters pop outward */
  #loader.leave .loader-letters img {
    animation: letterPop 0.22s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }
  @keyframes letterPop {
    0%   { transform: scale(1); opacity: 1; }
    60%  { transform: scale(1.5); opacity: 0.5; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* ════════════════════════════════════════
     SCENE
  ════════════════════════════════════════ */
  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 28% at 28% 18%, rgba(255,255,255,0.72) 0%, transparent 70%),
      radial-gradient(ellipse 38% 18% at 62% 32%, rgba(255,255,255,0.52) 0%, transparent 60%),
      linear-gradient(180deg, #a8d8f0 0%, #c4e9f8 30%, #daf2fc 60%, #eef8fd 100%);
    z-index: 0;
  }
  .bg-img {
    position: absolute;
    inset: 0;
    background-image: url('assets/skybg.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  /* ── NAV ──
     Key fix: the <a> tags only span the right ~160px (padding-right area).
     The wide nav div is just for the gradient background.
     We constrain the hover underline by setting the link width explicitly.
  ── */
  nav {
    position: absolute;
    top: 0; right: 0;
    width: 100vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-end;   /* links hug the right */
    gap: 97px;
    padding-right: 32px;
    background: linear-gradient(to right,
      transparent              0%,
      rgba(255,255,255,0.03)  30%,
      rgba(255,255,255,0.08)  50%,
      rgba(255,255,255,0.20)  65%,
      rgba(255,255,255,0.50)  78%,
      rgba(255,255,255,0.85)  90%,
      #ffffff                100%
    );
    z-index: 5;
  }
  nav a {
    /* constrain link to only the text width so underline doesn't stretch */
    display: inline-block;
    text-align: right;
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 0.99rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: #222;
    transition: color 0.2s, transform 0.2s;
    position: relative;
  }
  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; right: 0;
    /* width matches only the text, not the full nav panel */
    width: 0;
    height: 1px;
    background: #f03e8e;
    transition: width 0.25s;
  }
  nav a:hover { color: #f03e8e; transform: translateX(-3px); }
  nav a:hover::after { width: 100%; }

  /* ── BIO ── */
  .bio {
    position: absolute;
    left: 52vw;
    top: 31%;
    width: 230px;
    font-size: 0.99rem;
    font-weight: 300;
    line-height: 1.8;
    color: #ffffff;
    z-index: 10;
  }

  /* ── NAME PNG ── */
  .name-img {
    position: absolute;
    left: 12vw;
    top: 25%;
    width: clamp(245px, 34vw, 480px);
    pointer-events: none;
    z-index: 10;
    filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.10));
  }

  /* ── STATIC DECORATIVE ── */
  .deco-graphic {
    position: absolute;
    left: -10%;
    top: -11%;
    width: clamp(875px, 46vw, 620px);
    pointer-events: none;
    z-index: 7;
  }

  /* ── FLOATING OBJECTS ── */
  .obj {
    position: absolute;
    pointer-events: all;
    z-index: 8;
    opacity: 0;
    will-change: transform;
  }
  .obj img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  /* TOP CLUSTER — bigger, closer to reference scale */
  .obj-scissors { left: 10%;  top: 4%;   width: clamp(350px,  11vw, 152px); }
  .obj-cube { left: 5%;  top: 4%;   width: clamp(200px,  11vw, 152px); }
  .obj-8ball    { left: -1%;  top: 20%;   width: clamp(300px, 13vw, 180px); }

  /* BOTTOM CLUSTER — much bigger, dense like reference */
  .obj-globe    { left:  1%;  bottom: 8.3%; width: clamp(385px, 19vw, 260px); z-index:8; }
  .obj-phone    { left: 31%;  bottom: 14%; width: clamp(300px, 18vw, 245px); z-index:8; }
  .obj-heart    { left: 19%;  bottom:  6%; width: clamp(300px, 13vw, 175px); z-index:9;  }
  .obj-banana   { left: 40%;  bottom:  4%; width: clamp(350px, 17vw, 230px); z-index:9;  }
  .obj-flask    { left: 55%;  bottom: 12%; width: clamp(300px,  12vw, 160px); z-index:9;  }
  .obj-flower   { left:  14.5%;  bottom:  2%; width: clamp(200px, 14vw, 190px); z-index:9;  }
  .obj-ring     { left: 30%;  bottom:  0.3%; width: clamp(160px,   9vw, 125px); z-index:9;  }
  .obj-gem      { left:  -2%;  bottom:  3.4%; width: clamp(170px,   8vw, 108px); z-index:10; }
  .obj-dice     { left: 40%;  bottom:  1.5%; width: clamp(180px,   9vw, 118px); z-index:9;  }
  .obj-worm     { left: 59%;  bottom:  1%; width: clamp(210px, 12vw, 162px); z-index:9;  }
  .obj-bug      { left: 54%;  bottom: 14%; width: clamp(80px,   5vw,  70px); z-index:10; }

  /* ── FLOAT ANIMATIONS ── */
  @keyframes float1 {
    0%,100% { transform: translateY(0)    rotate(var(--rot, -2deg)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--rot, -2deg) + 4deg)); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0)   rotate(var(--rot, 3deg)); }
    50%     { transform: translateY(-9px) rotate(calc(var(--rot, 3deg) - 4deg)); }
  }
  @keyframes float3 {
    0%,100% { transform: translateY(-5px) rotate(var(--rot, -1deg)); }
    50%     { transform: translateY( 7px) rotate(calc(var(--rot, -1deg) + 3deg)); }
  }
  .float1 { animation: float1 var(--dur,6s) ease-in-out infinite; opacity:1; }
  .float2 { animation: float2 var(--dur,7s) ease-in-out infinite; opacity:1; }
  .float3 { animation: float3 var(--dur,6.5s) ease-in-out infinite; opacity:1; }

  /* ════════════════════════════════════════
     MOBILE  (≤ 768px)
     Layout: name top-left, nav horizontal bottom bar,
     objects fill full frame as dense collage, no white panel.
  ════════════════════════════════════════ */
  @media (max-width: 768px) {

    html, body { overflow: hidden; }

    .scene { min-height: 100svh; }

    /* Hide desktop nav gradient panel */
    nav {
      position: absolute;
      top: auto;
      bottom: 0; left: 0; right: 0;
      width: 100%;
      height: 52px;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 0;
      padding: 0 12px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 1px solid rgba(0,0,0,0.06);
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      z-index: 20;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      font-size: 0.65rem;
      letter-spacing: 0.03em;
      color: #222;
      padding: 0 10px;
      white-space: nowrap;
      transform: none !important;
    }
    nav a::after { bottom: -2px; }

    /* Name: top-left, smaller */
    .name-img {
      left: 12vw;
      top: 2%;
      width: clamp(150px, 58vw, 300px);
      filter: drop-shadow(0px 1px 4px rgba(0,0,0,0.15));
    }

    /* Bio: below name */
    .bio {
      left: 3vw;
      top: 34%;
      width: 52vw;
      font-size: 0.9rem;
      line-height: 1.7;
    }

    /* Loop graphic: big, top-left bleed */
    .deco-graphic {
      left: -9%;
      top: -7%;
      width: clamp(230px, 70vw, 340px);
      z-index: 9;
    }

    /* ── MOBILE OBJECT POSITIONS
       Dense collage filling the whole frame.
       Top objects cluster across upper area,
       bottom objects pile across lower half.
    ── */

    /* TOP */
    .obj-scissors { left: 66%;  top:  3%;  width: 30vw; }
    .obj-cube { left: 50%;  top:  3%;  width: 30vw; }
    .obj-8ball    { left: 74%;  top:  8%;  width: 19vw; }

    /* BOTTOM — spread across full width, pushed up since nav takes bottom */
    .obj-globe    { left:  0%;  bottom: 16%; width: 32vw; z-index:11; }
    .obj-phone    { left: 20%;  bottom: 20%; width: 30vw; z-index:10; }
    .obj-heart    { left: 19%;  bottom: 10%; width: 21vw; z-index:9;  }
    .obj-banana   { left: 38%;  bottom:  9%; width: 29vw; z-index:9;  }
    .obj-flask    { left: 60%;  bottom: 18%; width: 19vw; z-index:8;  }
    .obj-flower   { left:  9%;  bottom:  8%; width: 24vw; z-index:8;  }
    .obj-ring     { left: 14%;  bottom:  6%; width: 16vw; z-index:9;  }
    .obj-gem      { left:  3%;  bottom:  7%; width: 13vw; z-index:10; }
    .obj-dice     { left: 55%;  bottom:  8%; width: 15vw; z-index:9;  }
    .obj-worm     { left: 62%;  bottom:  7%; width: 22vw; z-index:8;  }
    .obj-bug      { left: 58%;  bottom: 26%; width:  9vw; z-index:10; }
  }
</style>
</head>
<body>

  <div id="loader">
    <!-- "now loading" spelled with individual letter PNGs -->
    <!-- filenames per your spec: n, o-2, w, (space), L, o, A, d, i, n, g -->
    <div class="loader-letters" id="loader-letters">
      <img src="assets/letters/n.png"   alt="n">
      <img src="assets/letters/o2.png" alt="o">
      <img src="assets/letters/w.png"   alt="w">
      <img src="assets/letters/L.png"   alt=" " style="margin-left:14px">
      <img src="assets/letters/O.png"   alt="o">
      <img src="assets/letters/A.png"   alt="a">
      <img src="assets/letters/d.png"   alt="d">
      <img src="assets/letters/i.png"   alt="i">
      <img src="assets/letters/n.png"   alt="n">
      <img src="assets/letters/g.png"   alt="g">
    </div>
    <svg class="retro-spinner" viewBox="0 0 62 62" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(31,31)">
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="1"    transform="rotate(0)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.82" transform="rotate(45)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.62" transform="rotate(90)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.46" transform="rotate(135)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.33" transform="rotate(180)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.22" transform="rotate(225)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.13" transform="rotate(270)"/>
        <rect x="-3.5" y="-29" width="7" height="16" rx="3.5" fill="#111" opacity="0.06" transform="rotate(315)"/>
      </g>
    </svg>
  </div>

  <!-- ══ MAIN SCENE ══ -->
  <div class="scene">

    <div class="bg"></div>
    <div class="bg-img"></div>

    <!-- Static decorative -->
    <img class="deco-graphic" src="assets/bggraphic.png" alt="" loading="eager">

    <!-- Nav (wide div for gradient, links are inline-block so underline is text-width only) -->
    <nav>
      <a href="pages/projects.html">projects</a>
      <a href="pages/experience.html">experience</a>
      <a href="pages/design.html">design</a>
      <a href="pages/contact.html">contact</a>
    </nav>


    <!-- Name PNG -->
    <img class="name-img" src="assets/ashleyhavens.png" alt="ashley havens">

    <!-- Bio -->
    <p class="bio">Ashley Havens is a multidisciplinary designer working across digital, print, and visual systems, with a focus on experimental and concept-driven design.</p>

    <!-- TOP CLUSTER -->
    <div class="obj obj-scissors" data-float="2" data-dur="7.5s" data-rot="120deg"><img src="assets/scissors.png"  alt="scissors" loading="lazy"></div>
    <div class="obj obj-cube" data-float="2" data-dur="7.5s" data-rot="2deg"><img src="assets/cube.png"  alt="cube" loading="lazy"></div>
    <div class="obj obj-8ball"    data-float="3" data-dur="6s"   data-rot="2deg" ><img src="assets/8ball.png"     alt="8ball"    loading="lazy"></div>

    <!-- BOTTOM CLUSTER -->
    <div class="obj obj-globe"    data-float="2" data-dur="7s"   data-rot="-5deg"><img src="assets/globe.png"     alt="globe"    loading="eager"></div>
    <div class="obj obj-phone"    data-float="1" data-dur="5s"   data-rot="4deg" ><img src="assets/phone.png"     alt="phone"    loading="lazy"></div>
    <div class="obj obj-heart"    data-float="3" data-dur="6s"   data-rot="-3deg"><img src="assets/heart.png"     alt="heart"    loading="lazy"></div>
    <div class="obj obj-banana"   data-float="2" data-dur="5.5s" data-rot="2deg" ><img src="assets/bananas.png"   alt="bananas"  loading="lazy"></div>
    <div class="obj obj-flask"    data-float="1" data-dur="6.5s" data-rot="-4deg"><img src="assets/flask.png"     alt="flask"    loading="lazy"></div>
    <div class="obj obj-flower"   data-float="3" data-dur="6s"   data-rot="6deg" ><img src="assets/flower.png"    alt="flower"   loading="lazy"></div>
    <div class="obj obj-ring"     data-float="2" data-dur="5s"   data-rot="-2deg"><img src="assets/ring.png"      alt="ring"     loading="lazy"></div>
    <div class="obj obj-gem"      data-float="1" data-dur="5.5s" data-rot="3deg" ><img src="assets/gem.png"       alt="gem"      loading="lazy"></div>
    <div class="obj obj-dice"     data-float="3" data-dur="4.5s" data-rot="-5deg"><img src="assets/dice.png"      alt="dice"     loading="lazy"></div>
    <div class="obj obj-worm"     data-float="2" data-dur="5s"   data-rot="4deg" ><img src="assets/worm.png"      alt="worm"     loading="lazy"></div>
    <div class="obj obj-bug"      data-float="1" data-dur="4s"   data-rot="-3deg"><img src="assets/ladybug.png"   alt="ladybug"  loading="lazy"></div>

  </div>

<script>
  // Stagger letter pulse animations
  document.querySelectorAll('.loader-letters img').forEach((img, i) => {
    img.style.animationDelay = (i * 0.07) + 's';
  });

  // Float animations
  document.querySelectorAll('.obj').forEach((el, i) => {
    el.style.setProperty('--rot', el.dataset.rot || '0deg');
    el.style.setProperty('--dur', el.dataset.dur || '6s');
    setTimeout(() => el.classList.add('float' + el.dataset.float), 350 + i * 55);
  });

  // Loader — 600ms then bounce up
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      if (!loader) return;
      loader.classList.add('leave');
      loader.addEventListener('transitionend', () => loader.remove(), { once: true });
    }, 900);
  });
</script>
</body>
</html>
