<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashley havens</title>
<link rel="preload" as="image" href="assets/skybg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Geist via Google Fonts (closest available); fallback to system sans-serif -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    cursor: crosshair;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  /* Sky gradient fallback */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 28% at 28% 18%, rgba(255,255,255,0.72) 0%, transparent 70%),
      radial-gradient(ellipse 38% 18% at 62% 32%, rgba(255,255,255,0.52) 0%, transparent 60%),
      linear-gradient(180deg, #a8d8f0 0%, #c4e9f8 30%, #daf2fc 60%, #eef8fd 100%);
    z-index: 0;
  }
  .bg-img {
    position: absolute;
    inset: 0;
    background-image: url('assets/skybg.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  /* ── NAV
     - solid white ends / gradient begins further left
     - width stays 50vw but the opaque zone starts later (further right)
     - leaves sit OVER this (z-index higher than nav)
  ── */
  nav {
    position: absolute;
    top: 0; right: 0;
    width: 50vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding-right: 32px;
    /*
      Solid white doesn't kick in until ~72% across the nav panel
      so the hard white edge sits further right on screen.
    */
    background: linear-gradient(to right,
      transparent              0%,
      rgba(255,255,255,0.02)  45%,
      rgba(255,255,255,0.12)  58%,
      rgba(255,255,255,0.45)  70%,
      rgba(255,255,255,0.88)  82%,
      #ffffff                100%
    );
    z-index: 20;
  }
  nav a {
    display: block;
    text-align: right;
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    font-size: 0.78rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-decoration: none;
    color: #222;
    transition: color 0.2s, transform 0.2s;
    position: relative;
  }
  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; right: 0;
    width: 0; height: 1px;
    background: #f03e8e;
    transition: width 0.25s;
  }
  nav a:hover { color: #f03e8e; transform: translateX(-4px); }
  nav a:hover::after { width: 100%; }

  /* ── BIO ── */
  .bio {
    position: absolute;
    left: 50vw;
    top: 33%;
    width: 185px;
    font-size: 0.63rem;
    font-weight: 300;
    line-height: 1.75;
    color: #1a1a1a;
    z-index: 10;
  }

  /* ── NAME IMAGE (replaces individual letter spans) ── */
  .name-img {
    position: absolute;
    /* same rough area as the old letter block */
    left: 6vw;
    top: 30%;
    width: clamp(280px, 38vw, 520px);
    pointer-events: none;
    z-index: 10;
    /* drop shadow so it reads on both light & dark areas of sky */
    filter: drop-shadow(0px 2px 8px rgba(0,0,0,0.12));
  }

  /* ── STATIC DECORATIVE ── */
  .deco-graphic {
    position: absolute;
    left: -4%;
    top: -8%;
    width: clamp(320px, 50vw, 680px); /* bigger loop */
    pointer-events: none;
    z-index: 9;
  }
  /* Leaves: bigger, and z-index ABOVE nav (21) so they sit over the white */
  .deco-leaves {
    position: absolute;
    right: -2%;         /* slightly off right edge */
    top: -5%;
    width: clamp(240px, 30vw, 420px); /* much bigger */
    pointer-events: none;
    z-index: 21;        /* above nav z-index:20 */
  }

  /* ── FLOATING OBJECTS ── */
  .obj {
    position: absolute;
    pointer-events: all;
    z-index: 8;
    opacity: 0;
    will-change: transform;
  }
  .obj img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }

  /* TOP CLUSTER */
  .obj-yoyo     { left: 28%;  top: -5%;   width: clamp(110px, 14vw, 195px); }
  .obj-cube     { left: 40%;  top:  0%;   width: clamp(95px,  12vw, 170px); }
  .obj-scissors { left: 53%;  top: -5%;   width: clamp(75px,   9vw, 130px); }
  .obj-8ball    { left: 61%;  top:  3%;   width: clamp(90px,  11vw, 155px); }

  /* BOTTOM CLUSTER */
  .obj-globe    { left:  1%;  bottom:  8%; width: clamp(140px, 17vw, 230px); z-index:11; }
  .obj-phone    { left: 18%;  bottom: 14%; width: clamp(130px, 16vw, 215px); z-index:10; }
  .obj-heart    { left: 17%;  bottom:  4%; width: clamp(90px,  11vw, 150px); z-index:9; }
  .obj-banana   { left: 30%;  bottom:  4%; width: clamp(125px, 15vw, 205px); z-index:9; }
  .obj-flask    { left: 45%;  bottom: 11%; width: clamp(80px,  10vw, 135px); z-index:8; }
  .obj-flower   { left:  9%;  bottom: -1%; width: clamp(100px, 12vw, 165px); z-index:8; }
  .obj-ring     { left: 15%;  bottom: -2%; width: clamp(65px,   8vw, 110px); z-index:9; }
  .obj-gem      { left:  6%;  bottom: -1%; width: clamp(55px,   7vw,  95px); z-index:10; }
  .obj-dice     { left: 42%;  bottom:  1%; width: clamp(60px,   7vw, 100px); z-index:9; }
  .obj-worm     { left: 49%;  bottom: -1%; width: clamp(85px,  10vw, 140px); z-index:8; }
  .obj-bug      { left: 47%;  bottom: 14%; width: clamp(38px,   4vw,  62px); z-index:10; }

  /* ── ANIMATIONS ── */
  @keyframes float1 {
    0%,100% { transform: translateY(0)    rotate(var(--rot, -2deg)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--rot, -2deg) + 4deg)); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0)   rotate(var(--rot, 3deg)); }
    50%     { transform: translateY(-9px) rotate(calc(var(--rot, 3deg) - 4deg)); }
  }
  @keyframes float3 {
    0%,100% { transform: translateY(-5px) rotate(var(--rot, -1deg)); }
    50%     { transform: translateY( 7px) rotate(calc(var(--rot, -1deg) + 3deg)); }
  }
  .float1 { animation: float1 var(--dur,6s) ease-in-out infinite; opacity:1; }
  .float2 { animation: float2 var(--dur,7s) ease-in-out infinite; opacity:1; }
  .float3 { animation: float3 var(--dur,6.5s) ease-in-out infinite; opacity:1; }
</style>
</head>
<body>
<div class="scene">

  <div class="bg"></div>
  <div class="bg-img"></div>

  <!-- STATIC DECORATIVE -->
  <img class="deco-graphic" src="assets/bggraphic.png" alt="" loading="eager">

  <!-- NAV -->
  <nav>
    <a href="pages/projects.html">projects</a>
    <a href="pages/experience.html">experience</a>
    <a href="pages/design.html">design</a>
    <a href="pages/awards.html">awards</a>
    <a href="pages/art.html">art</a>
    <a href="pages/fun.html">fun</a>
    <a href="pages/contact.html">contact</a>
  </nav>

  <!-- LEAVES — rendered AFTER nav so it paints on top -->
  <img class="deco-leaves" src="assets/leaves.png" alt="" loading="eager">

  <!-- NAME as PNG -->
  <img class="name-img" src="assets/ashleyhavens.png" alt="ashley havens">

  <!-- BIO -->
  <p class="bio">Ashley Havens is a multidisciplinary designer working across digital, print, and visual systems, with a focus on experimental and concept-driven design.</p>

  <!-- TOP CLUSTER -->
  <div class="obj obj-yoyo"     data-float="3" data-dur="5.5s" data-rot="-2deg"><img src="assets/yoyo.png"     alt="yoyo"     loading="lazy"></div>
  <div class="obj obj-cube"     data-float="1" data-dur="6.5s" data-rot="3deg" ><img src="assets/cube.png"     alt="cube"     loading="lazy"></div>
  <div class="obj obj-scissors" data-float="2" data-dur="7.5s" data-rot="-6deg"><img src="assets/scissors.png" alt="scissors" loading="lazy"></div>
  <div class="obj obj-8ball"    data-float="3" data-dur="6s"   data-rot="2deg" ><img src="assets/8ball.png"    alt="8ball"    loading="lazy"></div>

  <!-- BOTTOM CLUSTER -->
  <div class="obj obj-globe"    data-float="2" data-dur="7s"   data-rot="-5deg"><img src="assets/globe.png"    alt="globe"    loading="lazy"></div>
  <div class="obj obj-phone"    data-float="1" data-dur="5s"   data-rot="4deg" ><img src="assets/phone.png"    alt="phone"    loading="lazy"></div>
  <div class="obj obj-heart"    data-float="3" data-dur="6s"   data-rot="-3deg"><img src="assets/heart.png"    alt="heart"    loading="lazy"></div>
  <div class="obj obj-banana"   data-float="2" data-dur="5.5s" data-rot="2deg" ><img src="assets/bananas.png"  alt="bananas"  loading="lazy"></div>
  <div class="obj obj-flask"    data-float="1" data-dur="6.5s" data-rot="-4deg"><img src="assets/flask.png"    alt="flask"    loading="lazy"></div>
  <div class="obj obj-flower"   data-float="3" data-dur="6s"   data-rot="6deg" ><img src="assets/flower.png"   alt="flower"   loading="lazy"></div>
  <div class="obj obj-ring"     data-float="2" data-dur="5s"   data-rot="-2deg"><img src="assets/ring.png"     alt="ring"     loading="lazy"></div>
  <div class="obj obj-gem"      data-float="1" data-dur="5.5s" data-rot="3deg" ><img src="assets/gem.png"      alt="gem"      loading="lazy"></div>
  <div class="obj obj-dice"     data-float="3" data-dur="4.5s" data-rot="-5deg"><img src="assets/dice.png"     alt="dice"     loading="lazy"></div>
  <div class="obj obj-worm"     data-float="2" data-dur="5s"   data-rot="4deg" ><img src="assets/worm.png"     alt="worm"     loading="lazy"></div>
  <div class="obj obj-bug"      data-float="1" data-dur="4s"   data-rot="-3deg"><img src="assets/ladybug.png"  alt="ladybug"  loading="lazy"></div>

</div>
<script>
  document.querySelectorAll('.obj').forEach((el, i) => {
    el.style.setProperty('--rot', el.dataset.rot || '0deg');
    el.style.setProperty('--dur', el.dataset.dur || '6s');
    setTimeout(() => el.classList.add('float' + el.dataset.float), 350 + i * 55);
  });
</script>
</body>
</html>
