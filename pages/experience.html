<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Ashley Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root { --pink: #f03e8e; }

  html, body {
    width: 100%;
    min-height: 100%;
    background: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    /* hide default cursor — replaced by glass.png */
    cursor: none;
    overflow-x: hidden;
  }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 56px;
    height: 56px;
    /* offset so the lens center (slightly up-left) is the hot spot */
    transform: translate(-28px, -28px);
    transition: transform 0.08s ease, width 0.15s ease, height 0.15s ease;
  }
  #cursor img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  /* Bigger when hovering a folder */
  body.over-folder #cursor {
    width: 72px; height: 72px;
    transform: translate(-36px, -36px);
  }

  /* ── BACK ── */
  .back {
    position: fixed;
    top: 22px; left: 28px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: #bbb;
    z-index: 100;
    transition: color 0.2s;
  }
  .back:hover { color: #111; }
  .back::before { content: '← '; }

  /* ── PAGE TITLE ── */
  .page-title {
    text-align: center;
    padding: 80px 0 48px;
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #bbb;
    font-weight: 400;
  }

  /* ── FOLDER GRID — 3 per row, generous margins ── */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 40px 32px;
    max-width: 860px;
    margin: 0 auto;
    padding: 0 60px 100px;
  }

  .folder-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    cursor: none;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1);
  }
  .folder-item:hover {
    transform: scale(1.07) translateY(-4px);
  }
  .folder-item img.folder-img {
    width: 100%;
    max-width: 200px;
    height: auto;
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.08));
    transition: filter 0.2s;
  }
  .folder-item:hover img.folder-img {
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.14));
  }
  .folder-label {
    text-align: center;
  }
  .folder-label .org {
    font-size: 0.7rem;
    font-weight: 500;
    color: #111;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }
  .folder-label .role {
    font-size: 0.62rem;
    font-weight: 300;
    color: #888;
    letter-spacing: 0.02em;
  }

  /* ── FOLDER DETAIL OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.28);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .detail-panel {
    background: #fff;
    width: min(580px, 92vw);
    max-height: 80vh;
    border-radius: 14px;
    overflow-y: auto;
    padding: 44px 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.14);
    position: relative;
  }
  .detail-panel button.close {
    position: absolute;
    top: 16px; right: 20px;
    background: none; border: none;
    font-size: 0.9rem; color: #bbb;
    cursor: none;
    transition: color 0.2s;
  }
  .detail-panel button.close:hover { color: #111; }
  .detail-panel .d-tag {
    font-size: 0.58rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--pink);
    font-weight: 500;
    margin-bottom: 8px;
  }
  .detail-panel h2 {
    font-size: 1.3rem;
    font-weight: 500;
    letter-spacing: -0.025em;
    margin-bottom: 4px;
  }
  .detail-panel .d-date {
    font-size: 0.66rem;
    color: #aaa;
    letter-spacing: 0.04em;
    margin-bottom: 24px;
  }
  .detail-panel ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .detail-panel ul li {
    font-size: 0.78rem;
    font-weight: 300;
    line-height: 1.85;
    color: #333;
    padding-left: 16px;
    position: relative;
  }
  .detail-panel ul li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--pink);
    font-weight: 400;
  }
</style>
</head>
<body>

  <!-- Custom cursor -->
  <div id="cursor"><img src="../assets/glass.png" alt=""></div>

  <a class="back" href="../index.html">home</a>
  <div class="page-title">Experience</div>

  <!-- FOLDER GRID -->
  <div class="folder-grid" id="folder-grid"></div>

  <!-- DETAIL OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="detail-panel" id="detail-panel">
      <button class="close" id="detail-close">✕</button>
      <div class="d-tag" id="d-tag"></div>
      <h2 id="d-title"></h2>
      <div class="d-date" id="d-date"></div>
      <ul id="d-bullets"></ul>
    </div>
  </div>

<script>
  // ── EXPERIENCE DATA (from resume) ──
  const ITEMS = [
    {
      tag: 'Design Project',
      org: 'Toastworks',
      role: 'Co-founder',
      date: 'Jan 2025 — Present',
      bullets: [
        'Co-launched a Stanford d.school-affiliated project merging food and relationships through interactive social experiences.',
        'Facilitated relationship-building activities and manned the Toast Bar at Satellite Session pop-up events.'
      ]
    },
    {
      tag: 'Design Project',
      org: 'Seeing Eye to Eye',
      role: 'Lead Designer',
      date: 'Nov 2025',
      bullets: [
        'Led research, synthesis, and prototyping for a conversation-based campus experience showcasing how empathy improves the quality and safety of cross-political conversations.',
        'Presented final project at the DESIGN 1 end-of-quarter showcase.'
      ]
    },
    {
      tag: 'Creative Project',
      org: 'Kinda Genius',
      role: 'Co-creator & Designer',
      date: 'Oct 2025 — Present',
      bullets: [
        'Co-designing and producing a YouTube series experimenting with long and short-form content formats.',
        'Analyzing (and poking fun at) how people interpret expertise and intelligence online.'
      ]
    },
    {
      tag: 'Advocacy',
      org: 'American Cancer Society',
      role: 'CA Legislative Ambassador',
      date: 'Dec 2022 — Present',
      bullets: [
        'Advocated for regional policies and state bills that prioritize human health, especially in light of environmental factors such as poor air or water quality.'
      ]
    },
    {
      tag: 'Research',
      org: 'SDSU Research Foundation',
      role: 'Research Assistant',
      date: 'Mar 2023 — Aug 2024',
      bullets: [
        'Oversaw a study in partnership with ATMO® on the development of a personal air monitoring toolkit/mobile application.',
        'Enabled greater public access to air monitoring in indoor and outdoor locations.'
      ]
    },
    {
      tag: 'Internship',
      org: 'Comite Civico Del Valle',
      role: 'Environmental Health Intern',
      date: 'Sept 2022 — Sept 2023',
      bullets: [
        'Advised and mentored a cohort of 12 high school students.',
        'Personally engaged with local lawmakers and spoke at public workshops hosted by CalEPA\'s State Water Resources Control Board.',
        'Presented research and community concerns at state-level hearings.'
      ]
    }
  ];

  const grid    = document.getElementById('folder-grid');
  const overlay = document.getElementById('overlay');
  const panel   = document.getElementById('detail-panel');

  ITEMS.forEach(item => {
    const div = document.createElement('div');
    div.className = 'folder-item';
    div.innerHTML = `
      <img class="folder-img" src="../assets/folder.png" alt="${item.org}" loading="lazy">
      <div class="folder-label">
        <div class="org">${item.org}</div>
        <div class="role">${item.role}</div>
      </div>
    `;
    div.addEventListener('mouseenter', () => document.body.classList.add('over-folder'));
    div.addEventListener('mouseleave', () => document.body.classList.remove('over-folder'));
    div.addEventListener('click', () => openDetail(item));
    grid.appendChild(div);
  });

  const openDetail = item => {
    document.getElementById('d-tag').textContent   = item.tag;
    document.getElementById('d-title').textContent = item.org;
    document.getElementById('d-date').textContent  = `${item.role}  ·  ${item.date}`;
    const ul = document.getElementById('d-bullets');
    ul.innerHTML = item.bullets.map(b => `<li>${b}</li>`).join('');
    overlay.classList.add('open');
  };
  const closeDetail = () => overlay.classList.remove('open');
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e => { if(e.target===overlay) closeDetail(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

  // ── CUSTOM CURSOR TRACKING ──
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
</script>
</body>
</html>
