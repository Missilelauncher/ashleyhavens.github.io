<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Ashley Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --pink: #f03e8e; }

  html, body {
    width: 100%; height: 100%;
    background: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    cursor: none;
    overflow-x: hidden;
  }
  /* touch screens and keyboards keep a normal cursor */
  @media (pointer: coarse) { html, body, .folder-item { cursor: auto; } #cursor { display: none; } }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 52px; height: 52px;
    /* hot spot slightly up-left of center */
    transform: translate(-18px, -18px);
    transition: width 0.12s ease, height 0.12s ease, transform 0.12s ease;
    will-change: left, top;
  }
  #cursor img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* Bigger on folder hover */
  body.over-folder #cursor {
    width: 68px; height: 68px;
    transform: translate(-22px, -22px);
  }

  /* Normal cursor restored on back link and overlay */
  .back, .overlay, .detail-panel * { cursor: auto; }

  /* ── BACK ── */
  .back {
    position: fixed;
    top: 22px; left: 28px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: #bbb;
    z-index: 600;
    transition: color 0.2s;
    cursor: pointer;
  }
  .back:hover { color: #111; }
  .back::before { content: '← '; }

  /* ── VIEWPORT ── */

  /* ── BOARD ── */
  .board { width: 100%; }

  /* ── PAGE TITLE ── */
  .page-title {
    text-align: center;
    padding: 72px 0 40px;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #ccc;
    font-weight: 400;
  }

  /* ── FOLDER GRID — 3 per row, compact ── */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px 20px;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }
  @media (max-width: 640px) {
    .folder-grid { grid-template-columns: repeat(2, 1fr); gap: 20px 14px; padding: 0 20px 60px; }
    .detail-panel { padding: 36px 24px 28px; }
  }

  .folder-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: none;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1);
  }
  .folder-item:hover { transform: scale(1.08) translateY(-5px); }

  /* Folder image wrapper — applies color tint via CSS filter */
  .folder-wrap {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .folder-wrap img.folder-img {
    width: 100%;
    max-width: 230px;   /* bigger than before */
    height: auto;
    display: block;
    transition: filter 0.2s;
    /* base shadow */
    filter: var(--tint) drop-shadow(0 4px 12px rgba(0,0,0,0.1));
  }
  .folder-item:hover .folder-wrap img.folder-img {
    filter: var(--tint) drop-shadow(0 10px 28px rgba(0,0,0,0.18));
  }

  .folder-label { text-align: center; }
  .folder-label .org {
    font-size: 0.72rem; font-weight: 500;
    color: #111; letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .folder-label .role {
    font-size: 0.6rem; font-weight: 300; color: #999;
  }

  /* ── OVERLAY ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    cursor: auto;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .detail-panel {
    background: #fff;
    width: min(560px, 92vw);
    max-height: 80vh;
    border-radius: 14px;
    overflow-y: auto;
    padding: 44px 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.14);
    position: relative;
    cursor: auto;
  }
  .detail-panel button.close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none;
    font-size: 0.9rem; color: #bbb;
    cursor: pointer;
    transition: color 0.2s;
  }
  .detail-panel button.close:hover { color: #111; }
  .detail-panel .d-tag {
    font-size: 0.58rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--pink);
    font-weight: 500; margin-bottom: 8px;
  }
  .detail-panel h2 {
    font-size: 1.3rem; font-weight: 500;
    letter-spacing: -0.025em; margin-bottom: 4px;
  }
  .detail-panel .d-date {
    font-size: 0.66rem; color: #aaa;
    letter-spacing: 0.04em; margin-bottom: 24px;
  }
  .detail-panel ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .detail-panel ul li {
    font-size: 0.78rem; font-weight: 300;
    line-height: 1.85; color: #333;
    padding-left: 16px; position: relative;
  }
  .d-photos {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    margin-top: 26px;
  }
  .d-photos:empty { display: none; }
  .d-photos img, .d-photos .slot {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 8px; display: block; background: #f4f4f4;
  }
  .d-photos .slot {
    display: flex; align-items: center; justify-content: center;
    border: 1px dashed #ddd; color: #c4c4c4;
    font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .detail-panel ul li::before {
    content: '—'; position: absolute; left: 0;
    color: var(--pink); font-weight: 400;
  }
</style>
</head>
<body>

  <div id="cursor"><img src="../assets/glass.png" alt=""></div>
  <a class="back" href="../index.html"
     onmouseenter="hideCursor()"
     onmouseleave="showCursor()">home</a>

  <div class="overlay" id="overlay">
    <div class="detail-panel">
      <button class="close" id="detail-close">✕</button>
      <div class="d-tag" id="d-tag"></div>
      <h2 id="d-title"></h2>
      <div class="d-date" id="d-date"></div>
      <ul id="d-bullets"></ul>
      <div class="d-photos" id="d-photos"></div>
    </div>
  </div>

  <div class="board" id="board">
    <div class="page-title">Experience</div>
    <div class="folder-grid" id="folder-grid"></div>
  </div>

<script>
  // Folder tints — each folder gets a different CSS filter hue so they're visually distinct
  const TINTS = [
    'hue-rotate(0deg) saturate(1)',           // original yellow/tan
    'hue-rotate(180deg) saturate(1.2)',       // blue
    'hue-rotate(90deg) saturate(1.3)',        // green
    'hue-rotate(300deg) saturate(1.4)',       // pink/purple
    'hue-rotate(30deg) saturate(1.2)',        // orange
    'hue-rotate(240deg) saturate(1.1)',       // purple
  ];

  // Each folder's details. To add photos, put files in assets/ and list them,
  // e.g. photos: ['../assets/chaparral-cover.jpg']
  // Empty photo slots show as dashed boxes while SHOW_PHOTO_SLOTS is true;
  // set it to false to hide any slots you haven't filled yet.
  const SHOW_PHOTO_SLOTS = true;
  const ITEMS = [
    { tag:'Live Events', org:'Stanford Marching Band', role:'Graphix Lead', date:'Sept 2026 — Present', photos:[],
      bullets:['Designated script writer, formation and prop designer, and announcer for pregame and halftime shows at football games in Stanford Stadium.','Work alongside Stanford Athletics to approve concepts, create graphics for Jumbotron display, and announce scripts live at games.'] },
    { tag:'Course Project', org:'DESIGN 121', role:'Team Project Designer', date:'May 2026', photos:[],
      bullets:['Reimagined the UI of the New York Times website/app to make news more socially engaging for Gen Z while preserving journalistic trust.','Conducted user research and co-creation to design a high-fidelity interactive prototype, receiving project feedback from a NYT associate.'] },
    { tag:'Live Events', org:'Arbor Live', role:'Marketing Lead', date:'Feb 2026 — Present', photos:[],
      bullets:['Oversee marketing and visual promotion for live events, including the creation and distribution of event flyers.','Coordinate load-in, setup, and strike while managing audio and lighting for live performances.','Organize and lead biweekly, campus-wide Musician Jams.'] },
    { tag:'Publication', org:'The Stanford Chaparral', role:'Art Director', date:'Sept 2025 — Present', photos:[],
      bullets:['Lead visual direction for the third-oldest collegiate humor magazine in the U.S., developing cover illustrations, graphics, and page layouts from idea to quarterly publication.'] },
    { tag:'Creative Project', org:'Kinda Genius', role:'Co-creator & Designer', date:'Oct 2025 — Present', photos:[],
      bullets:['Co-designing and producing a YouTube series experimenting with long and short-form content formats.','Analyzing (and poking fun at) how people interpret expertise and intelligence online.'] },
    { tag:'Design Project', org:'Seeing Eye to Eye', role:'Lead Designer', date:'Nov 2025', photos:[],
      bullets:['Led research, synthesis, and prototyping for a conversation-based campus experience showcasing how empathy improves the quality and safety of cross-political conversations.','Presented at the DESIGN 1 end-of-quarter showcase.'] },
    { tag:'Design Project', org:'Toastworks', role:'Cofounder / Creative Direction', date:'Jan 2025 — Dec 2025', photos:[],
      bullets:['Co-launched a Stanford d.school-affiliated project merging food and relationships through interactive social experiences.','Facilitated relationship-building activities and manned the Toast Bar at Satellite Session pop-up events.'] },
    { tag:'Research', org:'SDSU Research Foundation', role:'Research Assistant', date:'Mar 2023 — Aug 2024', photos:[],
      bullets:['Oversaw a study in partnership with ATMO® on the development of a personal air monitoring toolkit/mobile application allowing greater public access to air monitoring in indoor and outdoor locations.','Personally engaged with local lawmakers and spoke at public workshops hosted by CalEPA, presenting research and community concerns.'] },
    { tag:'Advocacy', org:'American Cancer Society', role:'CA Legislative Ambassador', date:'Dec 2022 — Present', photos:[],
      bullets:['Advocated for regional policies and state bills that prioritize human health, especially in light of environmental factors such as poor air or water quality.'] },
    { tag:'Internship', org:'Comite Civico Del Valle', role:'Environmental Health Intern', date:'Sept 2022 — Sept 2023', photos:[],
      bullets:['Advised and mentored a cohort of 12 high school students.','Personally engaged with local lawmakers and spoke at public workshops hosted by CalEPA\'s State Water Resources Control Board.','Presented research and community concerns at state-level hearings.'] }
  ];

  const grid    = document.getElementById('folder-grid');
  const overlay = document.getElementById('overlay');

  ITEMS.forEach((item, i) => {
    const tint = TINTS[i % TINTS.length];
    const div = document.createElement('div');
    div.className = 'folder-item';
    div.style.setProperty('--tint', tint);
    div.innerHTML = `
      <div class="folder-wrap">
        <img class="folder-img" src="../assets/folder.png" alt="${item.org}" loading="lazy">
      </div>
      <div class="folder-label">
        <div class="org">${item.org}</div>
        <div class="role">${item.role}</div>
      </div>
    `;
    div.addEventListener('mouseenter', () => { document.body.classList.add('over-folder'); });
    div.addEventListener('mouseleave', () => { document.body.classList.remove('over-folder'); });
    div.addEventListener('click', () => {
      document.body.classList.remove('over-folder');
      openDetail(item);
    });
    grid.appendChild(div);
  });

  // ── DETAIL OVERLAY ──
  const openDetail = item => {
    document.getElementById('d-tag').textContent   = item.tag;
    document.getElementById('d-title').textContent = item.org;
    document.getElementById('d-date').textContent  = `${item.role}  ·  ${item.date}`;
    document.getElementById('d-bullets').innerHTML = item.bullets.map(b=>`<li>${b}</li>`).join('');
    const photos = item.photos || [];
    const slots = SHOW_PHOTO_SLOTS ? Math.max(0, 3 - photos.length) : 0;
    document.getElementById('d-photos').innerHTML =
      photos.map(src => `<img src="${src}" alt="${item.org}" loading="lazy">`).join('') +
      '<div class="slot">photo</div>'.repeat(slots);
    overlay.classList.add('open');
  };
  const closeDetail = () => { overlay.classList.remove('open'); };
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e => { if(e.target===overlay) closeDetail(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

  // ── CURSOR TRACKING ──
  const cursorEl = document.getElementById('cursor');
  let cx = -200, cy = -200;
  document.addEventListener('mousemove', e => {
    cx = e.clientX; cy = e.clientY;
    cursorEl.style.left = cx + 'px';
    cursorEl.style.top  = cy + 'px';
  });
  // hide cursor when leaving window
  document.addEventListener('mouseleave', () => { cursorEl.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { cursorEl.style.opacity = '1'; });

  const hideCursor = () => { cursorEl.style.opacity = '0'; document.body.classList.remove('over-folder'); };
  const showCursor = () => { cursorEl.style.opacity = '1'; };

</script>
</body>
</html>
