<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experience — Ashley Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --pink: #f03e8e; }

  html, body {
    width: 100%; height: 100%;
    background: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    cursor: none;
    overflow: hidden;
  }

  /* ── CUSTOM CURSOR ── */
  #cursor {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    width: 52px; height: 52px;
    /* hot spot slightly up-left of center */
    transform: translate(-18px, -18px);
    transition: width 0.12s ease, height 0.12s ease, transform 0.12s ease;
    will-change: left, top;
  }
  #cursor img { width: 100%; height: 100%; object-fit: contain; display: block; }

  /* Bigger on folder hover */
  body.over-folder #cursor {
    width: 68px; height: 68px;
    transform: translate(-22px, -22px);
  }

  /* Normal cursor restored on back link and overlay */
  .back, .overlay, .detail-panel * { cursor: auto; }

  /* ── BACK ── */
  .back {
    position: fixed;
    top: 22px; left: 28px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: #bbb;
    z-index: 600;
    transition: color 0.2s;
    cursor: pointer;
  }
  .back:hover { color: #111; }
  .back::before { content: '← '; }

  /* ── VIEWPORT ── */
  .viewport { position: fixed; inset: 0; overflow: hidden; }

  /* ── BOARD ── */
  .board {
    position: absolute;
    width: 100%; top: 0; left: 0;
    will-change: transform;
  }

  /* ── PAGE TITLE ── */
  .page-title {
    text-align: center;
    padding: 72px 0 40px;
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #ccc;
    font-weight: 400;
  }

  /* ── FOLDER GRID — 3 per row, compact ── */
  .folder-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px 20px;
    max-width: 780px;
    margin: 0 auto;
    padding: 0 40px 80px;
  }

  .folder-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    cursor: none;
    transition: transform 0.22s cubic-bezier(.34,1.56,.64,1);
  }
  .folder-item:hover { transform: scale(1.08) translateY(-5px); }

  /* Folder image wrapper — applies color tint via CSS filter */
  .folder-wrap {
    position: relative;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .folder-wrap img.folder-img {
    width: 100%;
    max-width: 230px;   /* bigger than before */
    height: auto;
    display: block;
    transition: filter 0.2s;
    /* base shadow */
    filter: var(--tint) drop-shadow(0 4px 12px rgba(0,0,0,0.1));
  }
  .folder-item:hover .folder-wrap img.folder-img {
    filter: var(--tint) drop-shadow(0 10px 28px rgba(0,0,0,0.18));
  }

  .folder-label { text-align: center; }
  .folder-label .org {
    font-size: 0.72rem; font-weight: 500;
    color: #111; letter-spacing: -0.01em; margin-bottom: 2px;
  }
  .folder-label .role {
    font-size: 0.6rem; font-weight: 300; color: #999;
  }

  /* ── OVERLAY ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
    cursor: auto;
  }
  .overlay.open { opacity: 1; pointer-events: all; }

  .detail-panel {
    background: #fff;
    width: min(560px, 92vw);
    max-height: 80vh;
    border-radius: 14px;
    overflow-y: auto;
    padding: 44px 48px 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.14);
    position: relative;
    cursor: auto;
  }
  .detail-panel button.close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none;
    font-size: 0.9rem; color: #bbb;
    cursor: pointer;
    transition: color 0.2s;
  }
  .detail-panel button.close:hover { color: #111; }
  .detail-panel .d-tag {
    font-size: 0.58rem; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--pink);
    font-weight: 500; margin-bottom: 8px;
  }
  .detail-panel h2 {
    font-size: 1.3rem; font-weight: 500;
    letter-spacing: -0.025em; margin-bottom: 4px;
  }
  .detail-panel .d-date {
    font-size: 0.66rem; color: #aaa;
    letter-spacing: 0.04em; margin-bottom: 24px;
  }
  .detail-panel ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .detail-panel ul li {
    font-size: 0.78rem; font-weight: 300;
    line-height: 1.85; color: #333;
    padding-left: 16px; position: relative;
  }
  .detail-panel ul li::before {
    content: '—'; position: absolute; left: 0;
    color: var(--pink); font-weight: 400;
  }
</style>
</head>
<body>

  <div id="cursor"><img src="../assets/glass.png" alt=""></div>
  <a class="back" href="../index.html"
     onmouseenter="hideCursor()"
     onmouseleave="showCursor()">home</a>

  <div class="overlay" id="overlay">
    <div class="detail-panel">
      <button class="close" id="detail-close">✕</button>
      <div class="d-tag" id="d-tag"></div>
      <h2 id="d-title"></h2>
      <div class="d-date" id="d-date"></div>
      <ul id="d-bullets"></ul>
    </div>
  </div>

  <div class="viewport">
    <div class="board" id="board">
      <div class="page-title">Experience</div>
      <div class="folder-grid" id="folder-grid"></div>
    </div>
  </div>

<script>
  // Folder tints — each folder gets a different CSS filter hue so they're visually distinct
  const TINTS = [
    'hue-rotate(0deg) saturate(1)',           // original yellow/tan
    'hue-rotate(180deg) saturate(1.2)',       // blue
    'hue-rotate(90deg) saturate(1.3)',        // green
    'hue-rotate(300deg) saturate(1.4)',       // pink/purple
    'hue-rotate(30deg) saturate(1.2)',        // orange
    'hue-rotate(240deg) saturate(1.1)',       // purple
  ];

  const ITEMS = [
    { tag:'Design Project', org:'Toastworks', role:'Co-founder', date:'Jan 2025 — Present',
      bullets:['Co-launched a Stanford d.school-affiliated project merging food and relationships through interactive social experiences.','Facilitated relationship-building activities and manned the Toast Bar at Satellite Session pop-up events.'] },
    { tag:'Design Project', org:'Seeing Eye to Eye', role:'Lead Designer', date:'Nov 2025',
      bullets:['Led research, synthesis, and prototyping for a conversation-based campus experience showcasing how empathy improves the quality and safety of cross-political conversations.','Presented at the DESIGN 1 end-of-quarter showcase.'] },
    { tag:'Creative Project', org:'Kinda Genius', role:'Co-creator & Designer', date:'Oct 2025 — Present',
      bullets:['Co-designing and producing a YouTube series experimenting with long and short-form content formats.','Analyzing (and poking fun at) how people interpret expertise and intelligence online.'] },
    { tag:'Advocacy', org:'American Cancer Society', role:'CA Legislative Ambassador', date:'Dec 2022 — Present',
      bullets:['Advocated for regional policies and state bills that prioritize human health, especially in light of environmental factors such as poor air or water quality.'] },
    { tag:'Research', org:'SDSU Research Foundation', role:'Research Assistant', date:'Mar 2023 — Aug 2024',
      bullets:['Oversaw a study in partnership with ATMO® on the development of a personal air monitoring toolkit/mobile application.','Enabled greater public access to air monitoring in indoor and outdoor locations.'] },
    { tag:'Internship', org:'Comite Civico Del Valle', role:'Environmental Health Intern', date:'Sept 2022 — Sept 2023',
      bullets:['Advised and mentored a cohort of 12 high school students.','Personally engaged with local lawmakers and spoke at public workshops hosted by CalEPA\'s State Water Resources Control Board.','Presented research and community concerns at state-level hearings.'] }
  ];

  const grid    = document.getElementById('folder-grid');
  const overlay = document.getElementById('overlay');

  ITEMS.forEach((item, i) => {
    const tint = TINTS[i % TINTS.length];
    const div = document.createElement('div');
    div.className = 'folder-item';
    div.style.setProperty('--tint', tint);
    div.innerHTML = `
      <div class="folder-wrap">
        <img class="folder-img" src="../assets/folder.png" alt="${item.org}" loading="lazy" style="filter:${tint} drop-shadow(0 4px 12px rgba(0,0,0,0.1))">
      </div>
      <div class="folder-label">
        <div class="org">${item.org}</div>
        <div class="role">${item.role}</div>
      </div>
    `;
    div.addEventListener('mouseenter', () => { document.body.classList.add('over-folder'); });
    div.addEventListener('mouseleave', () => { document.body.classList.remove('over-folder'); });
    div.addEventListener('click', () => {
      document.body.classList.remove('over-folder');
      openDetail(item);
    });
    grid.appendChild(div);
  });

  // ── DETAIL OVERLAY ──
  const openDetail = item => {
    document.getElementById('d-tag').textContent   = item.tag;
    document.getElementById('d-title').textContent = item.org;
    document.getElementById('d-date').textContent  = `${item.role}  ·  ${item.date}`;
    document.getElementById('d-bullets').innerHTML = item.bullets.map(b=>`<li>${b}</li>`).join('');
    overlay.classList.add('open');
  };
  const closeDetail = () => { overlay.classList.remove('open'); };
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  overlay.addEventListener('click', e => { if(e.target===overlay) closeDetail(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') closeDetail(); });

  // ── CURSOR TRACKING ──
  const cursorEl = document.getElementById('cursor');
  let cx = -200, cy = -200;
  document.addEventListener('mousemove', e => {
    cx = e.clientX; cy = e.clientY;
    cursorEl.style.left = cx + 'px';
    cursorEl.style.top  = cy + 'px';
  });
  // hide cursor when leaving window
  document.addEventListener('mouseleave', () => { cursorEl.style.opacity = '0'; });
  document.addEventListener('mouseenter', () => { cursorEl.style.opacity = '1'; });

  const hideCursor = () => { cursorEl.style.opacity = '0'; document.body.classList.remove('over-folder'); };
  const showCursor = () => { cursorEl.style.opacity = '1'; };

  // ── AUTO-SCROLL (down only) ──
  const board    = document.getElementById('board');
  const VH       = window.innerHeight;
  const SPEED    = 38;
  let scrollY    = 0;
  let last       = null;
  let userScrolling = false;
  let userTimer  = null;

  // measure board height after paint
  let BOARD_H = 0;
  requestAnimationFrame(() => {
    BOARD_H = board.scrollHeight;
    loop(null);
  });

  const loop = ts => {
    if (!last) last = ts;
    const dt = (ts - last) / 1000; last = ts;
    if (!userScrolling && !overlay.classList.contains('open')) {
      scrollY += SPEED * dt;
      if (scrollY >= BOARD_H - VH) scrollY = 0;
    }
    board.style.transform = `translateY(${-scrollY}px)`;
    requestAnimationFrame(loop);
  };

  // Down-only manual scroll
  window.addEventListener('wheel', e => {
    if (e.deltaY <= 0) return; // block scrolling up
    scrollY = Math.min(BOARD_H - VH, scrollY + e.deltaY * 0.7);
    userScrolling = true;
    clearTimeout(userTimer);
    userTimer = setTimeout(() => { userScrolling = false; }, 1500);
  }, { passive: true });
</script>
</body>
</html>
