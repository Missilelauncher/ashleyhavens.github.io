<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Ashley Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    background: #fff;
    color: #111;
    font-family: 'DM Sans', system-ui, sans-serif;
    cursor: crosshair;
    /* scrollable page */
    overflow-x: hidden;
    overflow-y: auto;
  }

  /* ── BACK ── */
  .back {
    position: fixed;
    top: 22px; left: 28px;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-decoration: none;
    color: #999;
    z-index: 100;
    transition: color 0.2s;
  }
  .back:hover { color: #111; }
  .back::before { content: '← '; }

  /* ── BOARD: the scrollable canvas ── */
  .board {
    position: relative;
    width: 100%;
    /* tall enough to scroll through all scattered items */
    height: 5000px;
  }

  /* ── SVG STRINGS — sits behind all cards ── */
  .strings-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .strings-svg line {
    stroke: #bbb;
    stroke-width: 0.8;
    /* slight droop via stroke-dasharray trick — we use curved paths instead */
  }
  .strings-svg path {
    fill: none;
    stroke: #c8c8c8;
    stroke-width: 0.9;
  }

  /* ── CARDS (sketch tiles) ── */
  .card {
    position: absolute;
    width: 130px;
    /* 3:4 portrait ratio */
    height: 173px;
    border-radius: 3px;
    overflow: hidden;
    opacity: 0.5;
    z-index: 2;
    /* each card gets a slight random rotation via inline style */
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: opacity 0.2s, transform 0.2s;
    will-change: transform;
  }
  .card img {
    width: 100%; height: 100%;
    object-fit: cover;
    /* slight zoom: scale the img so edges crop */
    transform: scale(1.08);
    display: block;
    decoding: async;
  }

  /* ── PROJECT CARDS (clickable, opaque, bigger) ── */
  .project-card {
    position: absolute;
    width: 190px;
    height: 253px; /* same 3:4 ratio, larger */
    border-radius: 6px;
    overflow: visible; /* label can poke out */
    opacity: 1;
    z-index: 10;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.13);
    transition: transform 0.28s cubic-bezier(.34,1.56,.64,1),
                box-shadow 0.28s ease;
    will-change: transform;
    text-decoration: none;
  }
  .project-card:hover {
    transform: var(--base-rot) scale(1.06) !important;
    box-shadow: 0 10px 32px rgba(0,0,0,0.18);
    z-index: 20;
  }
  .project-card img {
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.05);
    display: block;
    border-radius: 6px;
  }
  /* small label under each project card */
  .project-card .label {
    position: absolute;
    bottom: -22px;
    left: 0; right: 0;
    text-align: center;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #444;
  }

  /* ── PROJECT OVERLAY ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.96);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  .overlay-inner {
    max-width: 520px;
    width: 90%;
    padding: 48px 40px;
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    position: relative;
  }
  .overlay-inner h2 {
    font-size: 1.4rem;
    font-weight: 500;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }
  .overlay-inner p {
    font-size: 0.82rem;
    font-weight: 300;
    line-height: 1.85;
    color: #444;
  }
  .overlay-close {
    position: absolute;
    top: 18px; right: 20px;
    font-size: 1.1rem;
    cursor: pointer;
    color: #aaa;
    background: none;
    border: none;
    line-height: 1;
    transition: color 0.2s;
  }
  .overlay-close:hover { color: #111; }
</style>
</head>
<body>

  <a class="back" href="../index.html">home</a>

  <!-- PROJECT DESCRIPTION OVERLAY -->
  <div class="overlay" id="overlay">
    <div class="overlay-inner">
      <button class="overlay-close" id="overlay-close">✕</button>
      <h2 id="overlay-title"></h2>
      <p id="overlay-desc"></p>
    </div>
  </div>

  <!-- THE BOARD -->
  <div class="board" id="board">
    <!-- SVG strings drawn by JS -->
    <svg class="strings-svg" id="strings"></svg>
    <!-- Cards injected by JS -->
  </div>

<script>
  // ── PROJECT DATA ──
  const PROJECTS = [
    {
      slug: 'toastworks',
      img: '../assets/toastworks.PNG',
      title: 'Toastworks',
      desc: 'A branding and visual identity project exploring the ritual of morning routines through warm, tactile design systems.'
    },
    {
      slug: 'eyetoeye',
      img: '../assets/eyetoeye.PNG',
      title: 'Eye to Eye',
      desc: 'An editorial design project about perspective and empathy, using layered typography and collage to create visual dialogue.'
    },
    {
      slug: 'sustainable',
      img: '../assets/sustainable.PNG',
      title: 'Sustainable',
      desc: 'A concept campaign for sustainable living — clean systems, earth tones, and data-driven visual storytelling.'
    },
    {
      slug: 'meatball',
      img: '../assets/meatball.PNG',
      title: 'Meatball',
      desc: 'A playful packaging and identity project celebrating the unexpected joy of comfort food culture.'
    }
  ];

  const SKETCH_COUNT = 49;
  const BOARD_H      = 5000;
  const CARD_W       = 130;
  const CARD_H       = 173;
  const PROJ_W       = 190;
  const PROJ_H       = 253;
  const MARGIN       = 60; // keep cards away from edges

  const board   = document.getElementById('board');
  const svgEl   = document.getElementById('strings');
  const overlay = document.getElementById('overlay');
  const oTitle  = document.getElementById('overlay-title');
  const oDesc   = document.getElementById('overlay-desc');
  const oClose  = document.getElementById('overlay-close');

  // ── SEEDED PSEUDO-RANDOM (deterministic layout) ──
  let seed = 42;
  const rand = (min, max) => {
    seed = (seed * 16807 + 0) % 2147483647;
    return min + (seed / 2147483647) * (max - min);
  };

  // ── COLLISION CHECK ──
  const placed = [];
  const fits = (x, y, w, h, pad = 18) => {
    return placed.every(p =>
      x + w + pad < p.x || x > p.x + p.w + pad ||
      y + h + pad < p.y || y > p.y + p.h + pad
    );
  };

  const VW = window.innerWidth;

  // Place an item with collision detection, return {x,y} or null
  const placeItem = (w, h, yMin, yMax, attempts = 80) => {
    for (let i = 0; i < attempts; i++) {
      const x = rand(MARGIN, VW - w - MARGIN);
      const y = rand(yMin, yMax);
      if (fits(x, y, w, h)) {
        placed.push({ x, y, w, h });
        return { x, y };
      }
    }
    // fallback: place anyway
    const x = rand(MARGIN, VW - w - MARGIN);
    const y = rand(yMin, yMax);
    placed.push({ x, y, w, h });
    return { x, y };
  };

  // ── SCATTER SKETCH CARDS ──
  // Distribute across full board height in bands
  const bandH = (BOARD_H - 200) / SKETCH_COUNT;

  const sketchPositions = [];
  for (let i = 0; i < SKETCH_COUNT; i++) {
    const yMin = 80 + i * bandH;
    const yMax = yMin + bandH * 1.4;
    const pos  = placeItem(CARD_W, CARD_H, yMin, Math.min(yMax, BOARD_H - CARD_H - 60));
    const rot  = rand(-8, 8);
    sketchPositions.push({ ...pos, rot });

    const div = document.createElement('div');
    div.className = 'card';
    div.style.cssText = `left:${pos.x}px; top:${pos.y}px; transform:rotate(${rot}deg);`;

    const img = document.createElement('img');
    img.src     = `../assets/sketches/sketch${i + 1}.jpg`;
    img.alt     = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    div.appendChild(img);
    board.appendChild(div);
  }

  // ── SCATTER PROJECT CARDS ──
  // Spread project cards evenly through the board
  const projStep = BOARD_H / (PROJECTS.length + 1);
  const projectPositions = [];

  PROJECTS.forEach((proj, pi) => {
    const yTarget = projStep * (pi + 1);
    const pos = placeItem(PROJ_W, PROJ_H, yTarget - 150, yTarget + 150);
    const rot = rand(-5, 5);
    projectPositions.push({ ...pos, rot, cx: pos.x + PROJ_W / 2, cy: pos.y + 30 });

    const a = document.createElement('a');
    a.className   = 'project-card';
    a.href        = '#';
    a.dataset.slug = proj.slug;
    a.style.cssText = `left:${pos.x}px; top:${pos.y}px; transform:rotate(${rot}deg);`;
    a.style.setProperty('--base-rot', `rotate(${rot}deg)`);

    const img = document.createElement('img');
    img.src     = proj.img;
    img.alt     = proj.title;
    img.loading = 'eager';
    a.appendChild(img);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = proj.title;
    a.appendChild(label);

    a.addEventListener('click', e => {
      e.preventDefault();
      oTitle.textContent = proj.title;
      oDesc.textContent  = proj.desc;
      overlay.classList.add('open');
    });

    board.appendChild(a);
  });

  // ── DRAW STRINGS ──
  // Connect some sketch cards to the nearest project card with a drooping catenary curve
  svgEl.setAttribute('viewBox', `0 0 ${VW} ${BOARD_H}`);
  svgEl.setAttribute('width',  VW);
  svgEl.setAttribute('height', BOARD_H);

  // For each project card, connect ~4 nearby sketch cards with strings
  projectPositions.forEach(proj => {
    // Find closest sketch cards (by top-center point)
    const withDist = sketchPositions.map((s, i) => ({
      i, s,
      cx: s.x + CARD_W / 2,
      cy: s.y,
      dist: Math.hypot((s.x + CARD_W/2) - proj.cx, s.y - proj.cy)
    }));
    withDist.sort((a, b) => a.dist - b.dist);
    const nearest = withDist.slice(0, 4);

    nearest.forEach(({ cx, cy }) => {
      // catenary-ish cubic bezier: control points droop down
      const mx = (cx + proj.cx) / 2;
      const droop = Math.abs(cy - proj.cy) * 0.35 + 30;
      const my = Math.min(cy, proj.cy) + droop;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d',
        `M ${proj.cx} ${proj.cy} Q ${mx} ${my} ${cx} ${cy}`
      );
      svgEl.appendChild(path);
    });
  });

  // ── OVERLAY CLOSE ──
  oClose.addEventListener('click', () => overlay.classList.remove('open'));
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') overlay.classList.remove('open');
  });
</script>
</body>
</html>
