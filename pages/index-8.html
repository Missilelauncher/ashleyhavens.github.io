<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashley havens</title>
<link rel="preload" as="image" href="assets/skybg.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Space Mono', monospace;
    cursor: crosshair;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  /* Sky gradient fallback */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 28% at 28% 18%, rgba(255,255,255,0.72) 0%, transparent 70%),
      radial-gradient(ellipse 38% 18% at 62% 32%, rgba(255,255,255,0.52) 0%, transparent 60%),
      linear-gradient(180deg, #a8d8f0 0%, #c4e9f8 30%, #daf2fc 60%, #eef8fd 100%);
    z-index: 0;
  }
  .bg-img {
    position: absolute;
    inset: 0;
    background-image: url('assets/skybg.jpg');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 1;
  }

  /* ── NAV — no animation, stretches ~halfway, very soft fade ── */
  nav {
    position: absolute;
    top: 0; right: 0;
    /* ~50% of screen width for the fade zone */
    width: 50vw;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding-right: 32px;
    /*
      Very gentle fade: starts fully transparent at left edge,
      eases in very slowly, only becomes fully white at the far right.
      The long transparent zone makes it feel natural/barely there.
    */
    background: linear-gradient(to right,
      transparent               0%,
      rgba(255,255,255,0.04)   25%,
      rgba(255,255,255,0.15)   40%,
      rgba(255,255,255,0.50)   60%,
      rgba(255,255,255,0.90)   78%,
      #ffffff                 100%
    );
    z-index: 20;
    /* no animation */
  }
  nav a {
    display: block;
    text-align: right;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: #222;
    transition: color 0.2s, transform 0.2s;
    position: relative;
    /* no animation */
  }
  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; right: 0;
    width: 0; height: 1.5px;
    background: #f03e8e;
    transition: width 0.25s;
  }
  nav a:hover { color: #f03e8e; transform: translateX(-4px); }
  nav a:hover::after { width: 100%; }

  /* ── BIO ── */
  .bio {
    position: absolute;
    left: 50vw;
    top: 33%;
    width: 185px;
    font-size: 0.63rem;
    line-height: 1.75;
    color: #1a1a1a;
    z-index: 10;
  }

  /* ── HEADLINE ── */
  .headline {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
  }
  .letter {
    position: absolute;
    font-family: 'Anton', sans-serif;
    line-height: 1;
    display: block;
  }

  /* ── STATIC DECORATIVE — much bigger ── */
  .deco-graphic {
    position: absolute;
    left: -4%;
    top: -8%;
    /* way bigger — clips generously off top-left */
    width: clamp(280px, 42vw, 580px);
    pointer-events: none;
    z-index: 9;
    /* image-rendering hint for perf */
    image-rendering: auto;
  }
  .deco-leaves {
    position: absolute;
    right: 0;
    top: -4%;
    /* much bigger — clips off right edge */
    width: clamp(180px, 22vw, 320px);
    pointer-events: none;
    z-index: 5;
  }

  /* ── FLOATING OBJECTS — bigger, more spread left ── */
  .obj {
    position: absolute;
    pointer-events: all;
    z-index: 8;
    opacity: 0;
    will-change: transform;
  }
  .obj img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    /* hint browser to decode off main thread */
    decoding: async;
  }

  /*
    TOP CLUSTER — bigger sizes, spread across left ~60% of screen.
    Objects nudged to avoid overlapping the name block (8–38vw).
  */
  .obj-yoyo     { left: 28%;  top: -5%;   width: clamp(110px, 14vw, 195px); }
  .obj-cube     { left: 40%;  top:  0%;   width: clamp(95px,  12vw, 170px); }
  .obj-scissors { left: 53%;  top: -5%;   width: clamp(75px,  9vw,  130px); }
  .obj-8ball    { left: 61%;  top:  3%;   width: clamp(90px,  11vw, 155px); }

  /*
    BOTTOM CLUSTER — bigger, spread more generously left→center.
    Globe anchors far left, others fan out to ~55% of screen width.
  */
  .obj-globe    { left:  1%;  bottom:  8%; width: clamp(140px, 17vw, 230px); z-index:11; }
  .obj-phone    { left: 18%;  bottom: 14%; width: clamp(130px, 16vw, 215px); z-index:10; }
  .obj-heart    { left: 17%;  bottom:  4%; width: clamp(90px,  11vw, 150px); z-index:9; }
  .obj-banana   { left: 30%;  bottom:  4%; width: clamp(125px, 15vw, 205px); z-index:9; }
  .obj-flask    { left: 45%;  bottom: 11%; width: clamp(80px,  10vw, 135px); z-index:8; }
  .obj-flower   { left:  9%;  bottom: -1%; width: clamp(100px, 12vw, 165px); z-index:8; }
  .obj-ring     { left: 15%;  bottom: -2%; width: clamp(65px,   8vw, 110px); z-index:9; }
  .obj-gem      { left:  6%;  bottom: -1%; width: clamp(55px,   7vw,  95px); z-index:10; }
  .obj-dice     { left: 42%;  bottom:  1%; width: clamp(60px,   7vw, 100px); z-index:9; }
  .obj-worm     { left: 49%;  bottom: -1%; width: clamp(85px,  10vw, 140px); z-index:8; }
  .obj-bug      { left: 47%;  bottom: 14%; width: clamp(38px,   4vw,  62px); z-index:10; }

  /* ── ANIMATIONS ── */
  @keyframes float1 {
    0%,100% { transform: translateY(0)    rotate(var(--rot, -2deg)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--rot, -2deg) + 4deg)); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0)   rotate(var(--rot, 3deg)); }
    50%     { transform: translateY(-9px) rotate(calc(var(--rot, 3deg) - 4deg)); }
  }
  @keyframes float3 {
    0%,100% { transform: translateY(-5px) rotate(var(--rot, -1deg)); }
    50%     { transform: translateY( 7px) rotate(calc(var(--rot, -1deg) + 3deg)); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .float1 { animation: float1 var(--dur,6s) ease-in-out infinite; opacity:1; }
  .float2 { animation: float2 var(--dur,7s) ease-in-out infinite; opacity:1; }
  .float3 { animation: float3 var(--dur,6.5s) ease-in-out infinite; opacity:1; }
</style>
</head>
<body>
<div class="scene">

  <div class="bg"></div>
  <div class="bg-img"></div>

  <!-- STATIC DECORATIVE -->
  <img class="deco-graphic" src="assets/bggraphic.png" alt="" loading="eager">
  <img class="deco-leaves"  src="assets/leaves.png"    alt="" loading="eager">

  <!-- NAV -->
  <nav>
    <a href="pages/projects.html">projects</a>
    <a href="pages/experience.html">experience</a>
    <a href="pages/design.html">design</a>
    <a href="pages/awards.html">awards</a>
    <a href="pages/art.html">art</a>
    <a href="pages/fun.html">fun</a>
    <a href="pages/contact.html">contact</a>
  </nav>

  <!-- BIO -->
  <p class="bio">Ashley Havens is a multidisciplinary designer working across digital, print, and visual systems, with a focus on experimental and concept-driven design.</p>

  <!-- HEADLINE -->
  <div class="headline">
    <!-- ashley — white -->
    <span class="letter" style="left:8vw;  top:38%; font-size:clamp(38px,5.8vw,80px);  color:#fff; transform:rotate(-3deg) translateY( 5px);">a</span>
    <span class="letter" style="left:13vw; top:34%; font-size:clamp(46px,7.2vw,98px);  color:#fff; transform:rotate( 2deg) translateY(-8px);">S</span>
    <span class="letter" style="left:19vw; top:37%; font-size:clamp(36px,5.4vw,74px);  color:#fff; transform:rotate(-1deg) translateY( 3px);">h</span>
    <span class="letter" style="left:23vw; top:32%; font-size:clamp(50px,7.6vw,104px); color:#fff; transform:rotate( 3deg) translateY(-10px);">L</span>
    <span class="letter" style="left:28vw; top:36%; font-size:clamp(38px,6vw,82px);    color:#fff; transform:rotate(-2deg) translateY( 4px);">e</span>
    <span class="letter" style="left:33vw; top:30%; font-size:clamp(48px,7.4vw,100px); color:#fff; transform:rotate( 5deg) translateY(-12px);">Y</span>
    <!-- havens — solid black -->
    <span class="letter" style="left:8vw;  top:50%; font-size:clamp(36px,5.4vw,74px);  color:#111; transform:rotate(-2deg) translateY( 2px);">h</span>
    <span class="letter" style="left:13vw; top:47%; font-size:clamp(50px,7.6vw,102px); color:#111; transform:rotate( 3deg) translateY(-6px);">A</span>
    <span class="letter" style="left:19vw; top:49%; font-size:clamp(42px,6.6vw,90px);  color:#111; transform:rotate(-1deg) translateY( 3px);">v</span>
    <span class="letter" style="left:24vw; top:46%; font-size:clamp(44px,6.8vw,94px);  color:#111; transform:rotate( 2deg) translateY(-5px);">e</span>
    <span class="letter" style="left:29vw; top:48%; font-size:clamp(38px,6vw,82px);    color:#111; transform:rotate(-3deg) translateY( 4px);">n</span>
    <span class="letter" style="left:34vw; top:44%; font-size:clamp(48px,7.4vw,100px); color:#111; transform:rotate( 4deg) translateY(-8px);">S</span>
  </div>

  <!-- TOP CLUSTER -->
  <div class="obj obj-yoyo"     data-float="3" data-dur="5.5s" data-rot="-2deg"><img src="assets/yoyo.png"     alt="yoyo"     loading="lazy"></div>
  <div class="obj obj-cube"     data-float="1" data-dur="6.5s" data-rot="3deg" ><img src="assets/cube.png"     alt="cube"     loading="lazy"></div>
  <div class="obj obj-scissors" data-float="2" data-dur="7.5s" data-rot="-6deg"><img src="assets/scissors.png" alt="scissors" loading="lazy"></div>
  <div class="obj obj-8ball"    data-float="3" data-dur="6s"   data-rot="2deg" ><img src="assets/8ball.png"    alt="8ball"    loading="lazy"></div>

  <!-- BOTTOM CLUSTER -->
  <div class="obj obj-globe"    data-float="2" data-dur="7s"   data-rot="-5deg"><img src="assets/globe.png"    alt="globe"    loading="lazy"></div>
  <div class="obj obj-phone"    data-float="1" data-dur="5s"   data-rot="4deg" ><img src="assets/phone.png"    alt="phone"    loading="lazy"></div>
  <div class="obj obj-heart"    data-float="3" data-dur="6s"   data-rot="-3deg"><img src="assets/heart.png"    alt="heart"    loading="lazy"></div>
  <div class="obj obj-banana"   data-float="2" data-dur="5.5s" data-rot="2deg" ><img src="assets/bananas.png"  alt="bananas"  loading="lazy"></div>
  <div class="obj obj-flask"    data-float="1" data-dur="6.5s" data-rot="-4deg"><img src="assets/flask.png"    alt="flask"    loading="lazy"></div>
  <div class="obj obj-flower"   data-float="3" data-dur="6s"   data-rot="6deg" ><img src="assets/flower.png"   alt="flower"   loading="lazy"></div>
  <div class="obj obj-ring"     data-float="2" data-dur="5s"   data-rot="-2deg"><img src="assets/ring.png"     alt="ring"     loading="lazy"></div>
  <div class="obj obj-gem"      data-float="1" data-dur="5.5s" data-rot="3deg" ><img src="assets/gem.png"      alt="gem"      loading="lazy"></div>
  <div class="obj obj-dice"     data-float="3" data-dur="4.5s" data-rot="-5deg"><img src="assets/dice.png"     alt="dice"     loading="lazy"></div>
  <div class="obj obj-worm"     data-float="2" data-dur="5s"   data-rot="4deg" ><img src="assets/worm.png"     alt="worm"     loading="lazy"></div>
  <div class="obj obj-bug"      data-float="1" data-dur="4s"   data-rot="-3deg"><img src="assets/ladybug.png"  alt="ladybug"  loading="lazy"></div>

</div>
<script>
  document.querySelectorAll('.obj').forEach((el, i) => {
    el.style.setProperty('--rot', el.dataset.rot || '0deg');
    el.style.setProperty('--dur', el.dataset.dur || '6s');
    setTimeout(() => el.classList.add('float' + el.dataset.float), 350 + i * 55);
  });
</script>
</body>
</html>
