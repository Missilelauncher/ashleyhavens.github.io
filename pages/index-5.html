<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashley havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Space Mono', monospace;
    cursor: crosshair;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  /* Sky gradient fallback — always visible even before bg-sky.jpg loads */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 55% 28% at 28% 18%, rgba(255,255,255,0.72) 0%, transparent 70%),
      radial-gradient(ellipse 38% 18% at 62% 32%, rgba(255,255,255,0.52) 0%, transparent 60%),
      linear-gradient(180deg, #a8d8f0 0%, #c4e9f8 30%, #daf2fc 60%, #eef8fd 100%);
    z-index: 0;
  }
  /* bg image on top — loads when available, falls back to gradient above */
  .bg-img {
    position: absolute;
    inset: 0;
    background-image: url('assets/bg-sky.jpg');
    background-size: cover;
    background-position: center;
    z-index: 1;
  }

  /* Black bleed edges */
  .black-left {
    position: absolute;
    left: 0; top: 0;
    width: 3vw; height: 100%;
    background: #0a0a0a;
    z-index: 3;
  }
  .black-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 4vh;
    background: #0a0a0a;
    z-index: 3;
  }

  /* ── NAV ── */
  nav {
    position: absolute;
    top: 0; right: 0;
    width: 150px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding-right: 24px;
    background: rgba(255,255,255,0.52);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 20;
    border-left: 1px solid rgba(255,255,255,0.35);
    animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.2s both;
  }
  nav a {
    display: block;
    text-align: right;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: #222;
    transition: color 0.2s, transform 0.2s;
    position: relative;
  }
  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; right: 0;
    width: 0; height: 1.5px;
    background: #f03e8e;
    transition: width 0.25s;
  }
  nav a:hover { color: #f03e8e; transform: translateX(-4px); }
  nav a:hover::after { width: 100%; }

  /* ── BIO ── */
  .bio {
    position: absolute;
    left: 57vw;
    top: 33%;
    width: 185px;
    font-size: 0.63rem;
    line-height: 1.75;
    color: #1a1a1a;
    z-index: 10;
    animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.35s both;
  }

  /* ── HEADLINE ── */
  .headline {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.1s both;
  }
  .letter {
    position: absolute;
    font-family: 'Anton', sans-serif;
    line-height: 1;
    display: block;
  }

  /* ── OBJECTS ── */
  .obj {
    position: absolute;
    pointer-events: all;
    filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.22));
    transition: filter 0.2s;
    z-index: 8;
    opacity: 0;
  }
  .obj img {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  .obj:hover {
    filter: drop-shadow(4px 12px 22px rgba(0,0,0,0.38));
    z-index: 15;
  }

  /* TOP CLUSTER */
  .obj-loop     { left:  9%;  top: -5%;  width: clamp(90px, 13vw,175px); z-index:9; }
  .obj-star     { left:  3%;  top: 18%;  width: clamp(80px, 12vw,160px); z-index:10; }
  .obj-yoyo     { left: 22%;  top: -4%;  width: clamp(85px, 11vw,150px); }
  .obj-cube     { left: 35%;  top:  0%;  width: clamp(70px,  9vw,125px); }
  .obj-scissors { left: 50%;  top: -4%;  width: clamp(55px,  7vw,100px); }
  .obj-8ball    { left: 58%;  top:  4%;  width: clamp(65px,8.5vw,118px); }
  .obj-leaves   { right:153px; top: -2%; width: clamp(85px, 10vw,140px); z-index:5; }

  /* BOTTOM CLUSTER */
  .obj-globe    { left:  2%;  bottom: 10%; width: clamp(105px,13vw,175px); z-index:11; }
  .obj-phone    { left: 20%;  bottom: 15%; width: clamp(100px,12vw,165px); z-index:10; }
  .obj-heart    { left: 19%;  bottom:  6%; width: clamp(68px,  8vw,108px); z-index:9; }
  .obj-banana   { left: 30%;  bottom:  6%; width: clamp(95px, 12vw,160px); z-index:9; }
  .obj-flask    { left: 44%;  bottom: 13%; width: clamp(60px,7.5vw,100px); z-index:8; }
  .obj-flower   { left: 10%;  bottom:  1%; width: clamp(75px,  9vw,120px); z-index:8; }
  .obj-ring     { left: 16%;  bottom: -1%; width: clamp(50px,6.5vw, 85px); z-index:9; }
  .obj-gem      { left:  7%;  bottom:  0%; width: clamp(42px,5.5vw, 70px); z-index:10; }
  .obj-dice     { left: 42%;  bottom:  3%; width: clamp(46px,5.5vw, 74px); z-index:9; }
  .obj-worm     { left: 48%;  bottom:  1%; width: clamp(65px,  8vw,108px); z-index:8; }
  .obj-bug      { left: 46%;  bottom: 16%; width: clamp(28px,3.5vw, 48px); z-index:10; }

  /* ── ANIMATIONS ── */
  @keyframes float1 {
    0%,100% { transform: translateY(0)    rotate(var(--rot, -2deg)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--rot, -2deg) + 4deg)); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0)   rotate(var(--rot, 3deg)); }
    50%     { transform: translateY(-9px) rotate(calc(var(--rot, 3deg) - 4deg)); }
  }
  @keyframes float3 {
    0%,100% { transform: translateY(-5px) rotate(var(--rot, -1deg)); }
    50%     { transform: translateY( 7px) rotate(calc(var(--rot, -1deg) + 3deg)); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .float1 { animation: float1 var(--dur,6s) ease-in-out infinite; opacity:1; }
  .float2 { animation: float2 var(--dur,7s) ease-in-out infinite; opacity:1; }
  .float3 { animation: float3 var(--dur,6.5s) ease-in-out infinite; opacity:1; }
</style>
</head>
<body>
<div class="scene">

  <div class="bg"></div>
  <div class="bg-img"></div>
  <div class="black-left"></div>
  <div class="black-bottom"></div>

  <!-- NAV — all 7 links -->
  <nav>
    <a href="pages/projects.html">projects</a>
    <a href="pages/experience.html">experience</a>
    <a href="pages/design.html">design</a>
    <a href="pages/awards.html">awards</a>
    <a href="pages/art.html">art</a>
    <a href="pages/fun.html">fun</a>
    <a href="pages/contact.html">contact</a>
  </nav>

  <!-- BIO -->
  <p class="bio">Ashley Havens is a multidisciplinary designer working across digital, print, and visual systems, with a focus on experimental layouts and concept-driven design.</p>

  <!-- HEADLINE — each letter individually placed -->
  <div class="headline">
    <!-- ashley — white -->
    <span class="letter" style="left:22vw; top:38%; font-size:clamp(42px,6.5vw,88px);  color:#fff; transform:rotate(-3deg)  translateY( 5px);">a</span>
    <span class="letter" style="left:27vw; top:34%; font-size:clamp(52px,8vw,108px);   color:#fff; transform:rotate( 2deg)  translateY(-8px);">S</span>
    <span class="letter" style="left:33vw; top:37%; font-size:clamp(40px,6vw,82px);    color:#fff; transform:rotate(-1deg)  translateY( 3px);">h</span>
    <span class="letter" style="left:38vw; top:32%; font-size:clamp(56px,8.5vw,116px); color:#fff; transform:rotate( 3deg)  translateY(-10px);">L</span>
    <span class="letter" style="left:44vw; top:36%; font-size:clamp(44px,6.8vw,92px);  color:#fff; transform:rotate(-2deg)  translateY( 4px);">e</span>
    <span class="letter" style="left:49vw; top:30%; font-size:clamp(54px,8.2vw,112px); color:#fff; transform:rotate( 5deg)  translateY(-12px);">Y</span>
    <!-- havens — solid black -->
    <span class="letter" style="left:22vw; top:50%; font-size:clamp(40px,6vw,82px);    color:#111; transform:rotate(-2deg)  translateY( 2px);">h</span>
    <span class="letter" style="left:27vw; top:47%; font-size:clamp(56px,8.5vw,114px); color:#111; transform:rotate( 3deg)  translateY(-6px);">A</span>
    <span class="letter" style="left:34vw; top:49%; font-size:clamp(48px,7.5vw,102px); color:#111; transform:rotate(-1deg)  translateY( 3px);">v</span>
    <span class="letter" style="left:40vw; top:46%; font-size:clamp(50px,7.8vw,106px); color:#111; transform:rotate( 2deg)  translateY(-5px);">e</span>
    <span class="letter" style="left:46vw; top:48%; font-size:clamp(44px,6.8vw,92px);  color:#111; transform:rotate(-3deg)  translateY( 4px);">n</span>
    <span class="letter" style="left:51vw; top:44%; font-size:clamp(54px,8.2vw,112px); color:#111; transform:rotate( 4deg)  translateY(-8px);">S</span>
  </div>

  <!-- TOP CLUSTER -->
  <div class="obj obj-loop"     data-float="1" data-dur="6s"   data-rot="-4deg"><img src="assets/loop.png"      alt="loop"></div>
  <div class="obj obj-star"     data-float="2" data-dur="7s"   data-rot="5deg" ><img src="assets/star-pink.png" alt="star"></div>
  <div class="obj obj-yoyo"     data-float="3" data-dur="5.5s" data-rot="-2deg"><img src="assets/yoyo.png"      alt="yoyo"></div>
  <div class="obj obj-cube"     data-float="1" data-dur="6.5s" data-rot="3deg" ><img src="assets/cube.png"      alt="cube"></div>
  <div class="obj obj-scissors" data-float="2" data-dur="7.5s" data-rot="-6deg"><img src="assets/scissors.png"  alt="scissors"></div>
  <div class="obj obj-8ball"    data-float="3" data-dur="6s"   data-rot="2deg" ><img src="assets/8ball.png"     alt="8ball"></div>
  <div class="obj obj-leaves"   data-float="1" data-dur="8s"   data-rot="-3deg"><img src="assets/leaves.png"    alt="leaves"></div>

  <!-- BOTTOM CLUSTER -->
  <div class="obj obj-globe"    data-float="2" data-dur="7s"   data-rot="-5deg"><img src="assets/globe.png"     alt="globe"></div>
  <div class="obj obj-phone"    data-float="1" data-dur="5s"   data-rot="4deg" ><img src="assets/phone.png"     alt="phone"></div>
  <div class="obj obj-heart"    data-float="3" data-dur="6s"   data-rot="-3deg"><img src="assets/heart.png"     alt="heart"></div>
  <div class="obj obj-banana"   data-float="2" data-dur="5.5s" data-rot="2deg" ><img src="assets/banana.png"    alt="bananas"></div>
  <div class="obj obj-flask"    data-float="1" data-dur="6.5s" data-rot="-4deg"><img src="assets/flask.png"     alt="flask"></div>
  <div class="obj obj-flower"   data-float="3" data-dur="6s"   data-rot="6deg" ><img src="assets/flower.png"    alt="flower"></div>
  <div class="obj obj-ring"     data-float="2" data-dur="5s"   data-rot="-2deg"><img src="assets/ring.png"      alt="ring"></div>
  <div class="obj obj-gem"      data-float="1" data-dur="5.5s" data-rot="3deg" ><img src="assets/gem.png"       alt="gem"></div>
  <div class="obj obj-dice"     data-float="3" data-dur="4.5s" data-rot="-5deg"><img src="assets/dice.png"      alt="dice"></div>
  <div class="obj obj-worm"     data-float="2" data-dur="5s"   data-rot="4deg" ><img src="assets/worm.png"      alt="worm"></div>
  <div class="obj obj-bug"      data-float="1" data-dur="4s"   data-rot="-3deg"><img src="assets/ladybug.png"   alt="ladybug"></div>

</div>
<script>
  document.querySelectorAll('.obj').forEach((el, i) => {
    el.style.setProperty('--rot', el.dataset.rot || '0deg');
    el.style.setProperty('--dur', el.dataset.dur || '6s');
    setTimeout(() => el.classList.add('float' + el.dataset.float), 350 + i * 55);
  });
</script>
</body>
</html>
