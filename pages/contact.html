<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Ashley Havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #fff;
    font-family: 'DM Sans', system-ui, sans-serif;
    cursor: crosshair;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .back {
    position: fixed; top: 22px; left: 28px;
    font-size: 0.68rem; letter-spacing: 0.08em;
    text-decoration: none; color: #bbb; transition: color 0.2s;
  }
  .back:hover { color: #111; }
  .back::before { content: '← '; }
  .card { display: flex; align-items: center; gap: 64px; }
  .phone-img {
    width: clamp(150px, 20vw, 240px);
    height: auto; display: block;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-12px); }
  }
  .info {
    display: flex; flex-direction: column; gap: 13px;
    border-left: 1px solid #e8e8e8; padding-left: 64px;
  }
  .info .name { font-size: 1.15rem; font-weight: 500; letter-spacing: -0.02em; color: #111; margin-bottom: 2px; }
  .info a, .info span {
    font-size: 0.78rem; font-weight: 300; color: #666;
    text-decoration: none; letter-spacing: 0.02em; display: block; transition: color 0.2s;
  }
  .info a:hover { color: #f03e8e; }
</style>
</head>
<body>
  <a class="back" href="../index.html">home</a>
  <div class="card">
    <img class="phone-img" src="../assets/phone.png" alt="phone">
    <div class="info">
      <div class="name">Ashley Havens</div>
      <a href="mailto:ashleyhavens00@gmail.com">ashleyhavens00@gmail.com</a>
      <a href="tel:+17609096218">+1 (760) 909-6218</a>
      <a href="https://linkedin.com/in/ashleyhavens" target="_blank">linkedin.com/in/ashleyhavens</a>
      <span>Stanford, CA 94305</span>
    </div>
  </div>
</body>
</html>
