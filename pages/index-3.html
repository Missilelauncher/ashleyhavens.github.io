<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ashley havens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0a;
    font-family: 'Space Mono', monospace;
    cursor: crosshair;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    /* Sky fallback gradient if image hasn't loaded yet */
    background-color: #8ecae6;
    background-image:
      radial-gradient(ellipse 60% 30% at 30% 20%, rgba(255,255,255,0.7) 0%, transparent 70%),
      radial-gradient(ellipse 40% 20% at 65% 35%, rgba(255,255,255,0.5) 0%, transparent 60%),
      linear-gradient(180deg, #a8d8f0 0%, #c9ecfa 35%, #ddf2fc 65%, #eef8fd 100%),
      url('images/bg-sky.jpg');
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  .black-left {
    position: absolute;
    left: 0; top: 0;
    width: 3vw; height: 100%;
    background: #0a0a0a;
    z-index: 2;
  }
  .black-bottom {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 4vh;
    background: #0a0a0a;
    z-index: 2;
  }

  /* ── NAV ── */
  nav {
    position: absolute;
    top: 0; right: 0;
    width: 155px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 26px;
    padding-right: 26px;
    background: rgba(255,255,255,0.5);
    backdrop-filter: blur(6px);
    z-index: 20;
    border-left: 1px solid rgba(255,255,255,0.35);
    animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.2s both;
  }
  nav a {
    display: block;
    text-align: right;
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    text-decoration: none;
    color: #222;
    transition: color 0.2s, transform 0.2s;
    position: relative;
  }
  nav a::after {
    content: '';
    position: absolute;
    bottom: -3px; right: 0;
    width: 0; height: 1.5px;
    background: #f03e8e;
    transition: width 0.25s;
  }
  nav a:hover { color: #f03e8e; transform: translateX(-4px); }
  nav a:hover::after { width: 100%; }

  /* ── BIO ── */
  .bio {
    position: absolute;
    left: 57vw;
    top: 33%;
    width: 185px;
    font-size: 0.64rem;
    line-height: 1.7;
    color: #1a1a1a;
    z-index: 10;
    animation: fadeUp 0.9s cubic-bezier(.22,1,.36,1) 0.35s both;
  }

  /* ── HEADLINE — each letter is its own span, positioned individually ── */
  .headline {
    position: absolute;
    left: 0; top: 0;
    width: 100%; height: 100%;
    z-index: 10;
    pointer-events: none;
    animation: fadeUp 0.7s cubic-bezier(.22,1,.36,1) 0.1s both;
  }

  .letter {
    position: absolute;
    font-family: 'Anton', sans-serif;
    line-height: 1;
    display: block;
    /* color set inline */
  }

  /* ── FLOATING OBJECTS ── */
  .obj {
    position: absolute;
    pointer-events: all;
    filter: drop-shadow(2px 6px 12px rgba(0,0,0,0.22));
    transition: filter 0.2s, z-index 0s;
    z-index: 8;
    opacity: 0;
  }
  .obj img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .obj:hover {
    filter: drop-shadow(4px 12px 22px rgba(0,0,0,0.38));
    z-index: 15;
  }

  /* ── TOP CLUSTER: loop, star, yoyo, cube, scissors, 8ball, leaves
     In Figma these sit across the top edge of the sky rectangle,
     left-edge ~5% to ~73% of page width, all near the top 0–30% ── */
  .obj-loop     { left:  9%;  top: -5%;  width: clamp(90px, 13vw,175px); z-index:9; }
  .obj-star     { left:  3%;  top: 18%;  width: clamp(80px, 12vw,160px); z-index:10; }
  .obj-yoyo     { left: 22%;  top: -4%;  width: clamp(85px, 11vw,150px); }
  .obj-cube     { left: 35%;  top:  0%;  width: clamp(70px,  9vw,125px); }
  .obj-scissors { left: 50%;  top: -4%;  width: clamp(55px,  7vw,100px); }
  .obj-8ball    { left: 58%;  top:  4%;  width: clamp(65px,  8.5vw,118px); }
  .obj-leaves   { right:158px; top: -2%; width: clamp(85px, 10vw,140px); z-index:5; }

  /* ── BOTTOM CLUSTER: globe, phone, heart, banana, flask, flower, ring, gem, dice, worm, bug
     In Figma: dense pile, left edge ~2% to ~55% of page, bottom 30–0% ── */
  .obj-globe    { left:  2%;  bottom: 10%; width: clamp(105px,13vw,175px); z-index:11; }
  .obj-phone    { left: 20%;  bottom: 15%; width: clamp(100px,12vw,165px); z-index:10; }
  .obj-heart    { left: 19%;  bottom:  6%; width: clamp(68px,  8vw,108px); z-index:9; }
  .obj-banana   { left: 30%;  bottom:  6%; width: clamp(95px, 12vw,160px); z-index:9; }
  .obj-flask    { left: 44%;  bottom: 13%; width: clamp(60px,  7.5vw,100px); z-index:8; }
  .obj-flower   { left: 10%;  bottom:  1%; width: clamp(75px,  9vw,120px); z-index:8; }
  .obj-ring     { left: 16%;  bottom: -1%; width: clamp(50px,  6.5vw,85px); z-index:9; }
  .obj-gem      { left:  7%;  bottom:  0%; width: clamp(42px,  5.5vw,70px); z-index:10; }
  .obj-dice     { left: 42%;  bottom:  3%; width: clamp(46px,  5.5vw,74px); z-index:9; }
  .obj-worm     { left: 48%;  bottom:  1%; width: clamp(65px,  8vw,108px); z-index:8; }
  .obj-bug      { left: 46%;  bottom: 16%; width: clamp(28px,  3.5vw,48px); z-index:10; }

  /* ── FLOAT KEYFRAMES ── */
  @keyframes float1 {
    0%,100% { transform: translateY(0)    rotate(var(--rot,  -2deg)); }
    50%     { transform: translateY(-12px) rotate(calc(var(--rot, -2deg) + 4deg)); }
  }
  @keyframes float2 {
    0%,100% { transform: translateY(0)    rotate(var(--rot, 3deg)); }
    50%     { transform: translateY(-9px)  rotate(calc(var(--rot,  3deg) - 4deg)); }
  }
  @keyframes float3 {
    0%,100% { transform: translateY(-5px)  rotate(var(--rot, -1deg)); }
    50%     { transform: translateY( 7px)  rotate(calc(var(--rot, -1deg) + 3deg)); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .float1 { animation: float1 var(--dur,6s) ease-in-out infinite; opacity:1; }
  .float2 { animation: float2 var(--dur,7s) ease-in-out infinite; opacity:1; }
  .float3 { animation: float3 var(--dur,6.5s) ease-in-out infinite; opacity:1; }
</style>
</head>
<body>
<div class="scene">

  <div class="bg"></div>
  <div class="black-left"></div>
  <div class="black-bottom"></div>

  <!-- NAV -->
  <nav>
    <a href="pages/projects.html">projects</a>
    <a href="pages/experience.html">experience</a>
    <a href="pages/design.html">design</a>
    <a href="pages/art.html">art</a>
    <a href="pages/contact.html">contact</a>
  </nav>

  <!-- BIO -->
  <p class="bio">Ashley Havens is a multidisciplinary designer working across digital, print, and visual systems, with a focus on experimental layouts and concept-driven design.</p>

  <!--
    HEADLINE — each letter placed individually to match the Figma collage feel.
    Positions are in vw/vh so they scale with the viewport.
    Colors: white for "ashley", black for "havens" (matching your design).
    Each letter has a slight random rotation + vertical offset.
  -->
  <div class="headline">
    <!--
      Figma reference: name block occupies roughly left:22%–58% of the sky area.
      Sky area = viewport minus nav (~155px) minus black-left (~3vw).
      "ashley" white, top half; "havens" solid black, bottom half.
      Each letter: slightly different size + rotation + vertical nudge for collage feel.
    -->

    <!-- ashley — white -->
    <span class="letter" style="left:22vw; top:38%; font-size:clamp(42px,6.5vw,88px);  color:#fff; transform:rotate(-3deg)  translateY( 5px);">a</span>
    <span class="letter" style="left:27vw; top:34%; font-size:clamp(52px,8vw,108px);   color:#fff; transform:rotate( 2deg)  translateY(-8px);">S</span>
    <span class="letter" style="left:33vw; top:37%; font-size:clamp(40px,6vw,82px);    color:#fff; transform:rotate(-1deg)  translateY( 3px);">h</span>
    <span class="letter" style="left:38vw; top:32%; font-size:clamp(56px,8.5vw,116px); color:#fff; transform:rotate( 3deg)  translateY(-10px);">L</span>
    <span class="letter" style="left:44vw; top:36%; font-size:clamp(44px,6.8vw,92px);  color:#fff; transform:rotate(-2deg)  translateY( 4px);">e</span>
    <span class="letter" style="left:49vw; top:30%; font-size:clamp(54px,8.2vw,112px); color:#fff; transform:rotate( 5deg)  translateY(-12px);">Y</span>

    <!-- havens — solid black -->
    <span class="letter" style="left:22vw; top:50%; font-size:clamp(40px,6vw,82px);    color:#111; transform:rotate(-2deg)  translateY( 2px);">h</span>
    <span class="letter" style="left:27vw; top:47%; font-size:clamp(56px,8.5vw,114px); color:#111; transform:rotate( 3deg)  translateY(-6px);">A</span>
    <span class="letter" style="left:34vw; top:49%; font-size:clamp(48px,7.5vw,102px); color:#111; transform:rotate(-1deg)  translateY( 3px);">v</span>
    <span class="letter" style="left:40vw; top:46%; font-size:clamp(50px,7.8vw,106px); color:#111; transform:rotate( 2deg)  translateY(-5px);">e</span>
    <span class="letter" style="left:46vw; top:48%; font-size:clamp(44px,6.8vw,92px);  color:#111; transform:rotate(-3deg)  translateY( 4px);">n</span>
    <span class="letter" style="left:51vw; top:44%; font-size:clamp(54px,8.2vw,112px); color:#111; transform:rotate( 4deg)  translateY(-8px);">S</span>
  </div>

  <!-- TOP CLUSTER -->
  <div class="obj obj-loop"     data-float="1" data-dur="6s"   data-rot="-4deg"><img src="images/loop.png"      alt="loop"></div>
  <div class="obj obj-star"     data-float="2" data-dur="7s"   data-rot="5deg" ><img src="images/star-pink.png" alt="star"></div>
  <div class="obj obj-yoyo"     data-float="3" data-dur="5.5s" data-rot="-2deg"><img src="images/yoyo.png"      alt="yoyo"></div>
  <div class="obj obj-cube"     data-float="1" data-dur="6.5s" data-rot="3deg" ><img src="images/cube.png"      alt="cube"></div>
  <div class="obj obj-scissors" data-float="2" data-dur="7.5s" data-rot="-6deg"><img src="images/scissors.png"  alt="scissors"></div>
  <div class="obj obj-8ball"    data-float="3" data-dur="6s"   data-rot="2deg" ><img src="images/8ball.png"     alt="8ball"></div>
  <div class="obj obj-leaves"   data-float="1" data-dur="8s"   data-rot="-3deg"><img src="images/leaves.png"    alt="leaves"></div>

  <!-- BOTTOM CLUSTER -->
  <div class="obj obj-globe"    data-float="2" data-dur="7s"   data-rot="-5deg"><img src="images/globe.png"     alt="globe"></div>
  <div class="obj obj-phone"    data-float="1" data-dur="5s"   data-rot="4deg" ><img src="images/phone.png"     alt="phone"></div>
  <div class="obj obj-heart"    data-float="3" data-dur="6s"   data-rot="-3deg"><img src="images/heart.png"     alt="heart"></div>
  <div class="obj obj-banana"   data-float="2" data-dur="5.5s" data-rot="2deg" ><img src="images/banana.png"    alt="bananas"></div>
  <div class="obj obj-flask"    data-float="1" data-dur="6.5s" data-rot="-4deg"><img src="images/flask.png"     alt="flask"></div>
  <div class="obj obj-flower"   data-float="3" data-dur="6s"   data-rot="6deg" ><img src="images/flower.png"    alt="flower"></div>
  <div class="obj obj-ring"     data-float="2" data-dur="5s"   data-rot="-2deg"><img src="images/ring.png"      alt="ring"></div>
  <div class="obj obj-gem"      data-float="1" data-dur="5.5s" data-rot="3deg" ><img src="images/gem.png"       alt="gem"></div>
  <div class="obj obj-dice"     data-float="3" data-dur="4.5s" data-rot="-5deg"><img src="images/dice.png"      alt="dice"></div>
  <div class="obj obj-worm"     data-float="2" data-dur="5s"   data-rot="4deg" ><img src="images/worm.png"      alt="worm"></div>
  <div class="obj obj-bug"      data-float="1" data-dur="4s"   data-rot="-3deg"><img src="images/ladybug.png"   alt="ladybug"></div>

</div>

<script>
  // Apply rotation CSS var + stagger-reveal each object into its float animation
  document.querySelectorAll('.obj').forEach((el, i) => {
    const rot = el.dataset.rot || '0deg';
    el.style.setProperty('--rot', rot);
    el.style.setProperty('--dur', el.dataset.dur || '6s');
    setTimeout(() => {
      el.classList.add('float' + el.dataset.float);
    }, 350 + i * 55);
  });
</script>
</body>
</html>
